name: Offline filesystem capability chain

on:
  workflow_call:
    inputs:
      reuse_references:
        description: Use independently qualified inputs only after the caller admits the reviewed pin
        type: boolean
        default: false
      family:
        description: Complete filesystem capability to capture, replay and verify
        type: string
        required: true
      readback_run:
        description: Completed run whose captures and portable output jobs must have passed
        type: string
        default: ''
      readback_family:
        description: One offline editing capability to verify, or empty for every capability
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  APFS_REQUIRED_CONTROLS: copy-truncation,copy-setid,metadata-collapse-reuse

jobs:
  capture:
    if: inputs.readback_run == ''
    name: Record Apple ${{ inputs.family }} editing controls (macOS ${{ matrix.major }})
    runs-on: ${{ inputs.reuse_references && 'ubuntu-24.04' || matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26, xcode-27]
        include:
          - {runner: macos-15, major: 15}
          - {runner: macos-26, major: 26}
          - {runner: xcode-27, major: 27}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: ${{ inputs.reuse_references }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore verified original Apple reference inputs
        if: ${{ inputs.reuse_references }}
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 acceptance/qualification/reference_reuse.py materialize
          --assets "$RUNNER_TEMP/native-reference-assets"
          --artifact "offline-editing-${{ inputs.family }}-reference-${{ matrix.major }}"
          --major "${{ matrix.major }}"
          --destination "artifacts/offline-editing-${{ inputs.family }}"
          --scratch "$RUNNER_TEMP"
          --proof "artifacts/qualification/capture-approved-${{ matrix.major }}/admission.json"
      - name: Require a disposable GitHub-hosted VM
        if: ${{ !(inputs.reuse_references) }}
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Capture independent Apple before and after edits
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'apfs') }}
        run: python3 acceptance/native/apfs_geometry.py --expected-major "${{ matrix.major }}" --output artifacts/offline-editing-apfs/macos-${{ matrix.major }}
      - name: Capture native attributes initialization and node-map extension
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'hfs') }}
        run: python3 acceptance/native/hfs_metadata_growth.py --expected-major "${{ matrix.major }}" --output artifacts/offline-editing-hfs/macos-${{ matrix.major }}
      - name: Capture native fragmented metadata overflow
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'hfs-fragmented') }}
        run: python3 acceptance/native/hfs_metadata_growth.py --fragmented-only --expected-major "${{ matrix.major }}" --output artifacts/offline-editing-hfs-fragmented/macos-${{ matrix.major }}
      - name: Capture native ACL inheritance, creator ownership and set-ID effects
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'permissions') }}
        run: python3 acceptance/native/permission_inheritance.py --expected-major "${{ matrix.major }}" --output artifacts/offline-editing-permissions/macos-${{ matrix.major }}
      - name: Capture native cp preservation and destination ACL inheritance
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'copy-permissions') }}
        run: python3 acceptance/native/permission_inheritance.py --copy-only --expected-major "${{ matrix.major }}" --output artifacts/offline-editing-copy-permissions/macos-${{ matrix.major }}
      - name: Capture native directory-stat origins and inheritance
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'statistics') }}
        run: python3 acceptance/native/apfs_geometry.py --directory-statistics --expected-major "${{ matrix.major }}" --output artifacts/offline-editing-statistics/macos-${{ matrix.major }}
      - name: Capture native directory-stat, fork, move and deletion transitions
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'statistics-transitions') }}
        run: python3 acceptance/native/apfs_directory_statistics.py --expected-major "${{ matrix.major }}" --output artifacts/offline-editing-statistics-transitions/macos-${{ matrix.major }}
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'apfs') }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "apfs-geometry=artifacts/offline-editing-apfs"
          --output "artifacts/qualification/capture-apfs-geometry"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'hfs') }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "hfs-metadata-growth=artifacts/offline-editing-hfs"
          --output "artifacts/qualification/capture-hfs-metadata-growth"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'hfs-fragmented') }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "hfs-fragmented-metadata=artifacts/offline-editing-hfs-fragmented"
          --output "artifacts/qualification/capture-hfs-fragmented-metadata"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'permissions') }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "permission-inheritance=artifacts/offline-editing-permissions"
          --output "artifacts/qualification/capture-permission-inheritance"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'copy-permissions') }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "copy-permissions=artifacts/offline-editing-copy-permissions"
          --output "artifacts/qualification/capture-copy-permissions"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'statistics') }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "apfs-directory-statistics=artifacts/offline-editing-statistics"
          --output "artifacts/qualification/capture-apfs-directory-statistics"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) && (inputs.family == 'statistics-transitions') }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "apfs-directory-statistics-transitions=artifacts/offline-editing-statistics-transitions"
          --output "artifacts/qualification/capture-apfs-directory-statistics-transitions"
      - name: Retain original disks and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-editing-${{ inputs.family }}-reference-${{ matrix.major }}
          path: artifacts/offline-editing-${{ inputs.family }}
          compression-level: 0
          if-no-files-found: error
      - name: Retain required capture execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-offline-editing-${{ inputs.family }}-${{ github.job }}-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            artifacts/qualification/capture-*/
            artifacts/qualification/replay-*/plan.json
            artifacts/qualification/replay-*/receipt.json
            artifacts/qualification/replay-*/events.jsonl
            artifacts/qualification/replay-*/inputs.json
            artifacts/qualification/replay-*/source-inputs.json
            artifacts/**/.qualification/*/*.json
            artifacts/**/.qualification/*/*.jsonl
            artifacts/**/*.plan.json
            artifacts/**/*.receipt.json
            artifacts/**/*.events.jsonl
          if-no-files-found: error

  replay:
    if: inputs.readback_run == ''
    name: Edit offline editing ${{ inputs.family }} controls (${{ matrix.host }}, macOS ${{ matrix.major }} sources)
    needs: capture
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        major: [15, 26, 27]
        include:
          - {runner: ubuntu-24.04, host: Linux}
          - {runner: windows-2025, host: Windows}
          - {runner: macos-26, host: macOS}
        # Explicit Cartesian host/source axes keep runtime bounded per job.
        runner: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v7
        with:
          name: offline-editing-${{ inputs.family }}-reference-${{ matrix.major }}
          path: artifacts/offline-editing-${{ inputs.family }}
      - name: Compare exact native contents, identities, metadata and volume policy
        run: go run ./acceptance/qualification -replay -- -v -count=1 -timeout 25m ./acceptance -run '${{ inputs.family == 'apfs' && '^TestNativeAPFSGeometryEditing$' || inputs.family == 'hfs' && '^TestNativeHFSMetadataGrowth$' || inputs.family == 'permissions' && '^TestNative(PermissionInheritance|SessionPermissionInheritance)$' || inputs.family == 'statistics' && '^TestNativeAPFSDirectoryStatistics$' || inputs.family == 'copy-permissions' && '^TestNativeCopyPermissions$' || inputs.family == 'statistics-transitions' && '^TestNativeAPFSDirectoryStatisticsTransitions$' || '^TestNativeHFSFragmentedMetadataGrowth$' }}'
        env:
          APFS_REQUIRED_NATIVE_MAJORS: ${{ matrix.major }}
          APFS_NATIVE_APFS_GEOMETRY: ../artifacts/offline-editing-apfs
          APFS_GEOMETRY_OUTPUT: ../artifacts/offline-editing-apfs-${{ matrix.host }}
          APFS_NATIVE_HFS_METADATA_GROWTH: ../artifacts/offline-editing-hfs
          APFS_HFS_METADATA_GROWTH_OUTPUT: ../artifacts/offline-editing-hfs-${{ matrix.host }}
          APFS_NATIVE_HFS_FRAGMENTED_METADATA: ../artifacts/offline-editing-hfs-fragmented
          APFS_HFS_FRAGMENTED_METADATA_OUTPUT: ../artifacts/offline-editing-hfs-fragmented-${{ matrix.host }}
          APFS_NATIVE_PERMISSION_INHERITANCE: ../artifacts/offline-editing-permissions
          APFS_PERMISSION_INHERITANCE_OUTPUT: ../artifacts/offline-editing-permissions-${{ matrix.host }}
          APFS_NATIVE_DIRECTORY_STATISTICS_TRANSITIONS: ../artifacts/offline-editing-statistics-transitions
          APFS_DIRECTORY_STATISTICS_TRANSITIONS_OUTPUT: ../artifacts/offline-editing-statistics-transitions-${{ matrix.host }}
          APFS_NATIVE_COPY_PERMISSIONS: ../artifacts/offline-editing-copy-permissions
          APFS_COPY_PERMISSIONS_OUTPUT: ../artifacts/offline-editing-copy-permissions-${{ matrix.host }}
          APFS_NATIVE_DIRECTORY_STATISTICS: ../artifacts/offline-editing-statistics
          APFS_DIRECTORY_STATISTICS_OUTPUT: ../artifacts/offline-editing-statistics-${{ matrix.host }}
      - name: Archive portable outputs
        shell: bash
        run: |
          archive_options=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            archive_options=(--no-mac-metadata --no-xattrs --no-acls)
          fi
          tar -czf artifacts/offline-editing-${{ inputs.family }}-${{ matrix.host }}-${{ matrix.major }}.tar.gz "${archive_options[@]}" -C artifacts offline-editing-${{ inputs.family }}-${{ matrix.host }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-editing-${{ inputs.family }}-output-${{ matrix.host }}-${{ matrix.major }}
          path: artifacts/offline-editing-${{ inputs.family }}-*.tar.gz
          compression-level: 0
          if-no-files-found: error

  archive:
    name: Validate archived native controls and portable outputs
    if: inputs.readback_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require successful captures and replays with unchanged construction inputs
        run: python3 acceptance/native/readback_source.py
        env:
          READBACK_RUN: ${{ inputs.readback_run }}
          READBACK_SCOPE: offline-editing
          READBACK_FAMILY: ${{ inputs.readback_family }}
          GH_TOKEN: ${{ github.token }}

  readback:
    name: Apple checks and continued writes of offline editing ${{ inputs.family }} outputs (macOS ${{ matrix.major }})
    if: ${{ always() && !cancelled() && ((inputs.readback_run == '' && needs.replay.result == 'success') || (inputs.readback_run != '' && needs.archive.result == 'success')) }}
    needs: [replay, archive]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26, xcode-27]
        include:
          - {runner: macos-15, major: 15}
          - {runner: macos-26, major: 26}
          - {runner: xcode-27, major: 27}
    env:
      READBACK_RUN: ${{ inputs.readback_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.readback_run || github.run_id }}
          github-token: ${{ github.token }}
          pattern: offline-editing-${{ inputs.family }}-reference-*
          path: artifacts/offline-editing-${{ inputs.family }}
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.readback_run || github.run_id }}
          github-token: ${{ github.token }}
          pattern: offline-editing-${{ inputs.family }}-output-*
          path: artifacts/outputs
          merge-multiple: true
      - name: Unpack all source and host outputs
        run: |
          for archive_file in artifacts/outputs/*.tar.gz; do
            tar -xzf "$archive_file" --no-mac-metadata --no-xattrs --no-acls --options '!mac-ext' -C artifacts/outputs
          done
      - name: Qualify output sectors, files, signatures, volume limits and further allocation
        if: inputs.family == 'apfs'
        run: python3 acceptance/native/verify_apfs_offline_editing.py --expected-major "${{ matrix.major }}" --corpus artifacts/offline-editing-apfs --outputs artifacts/outputs
      - name: Qualify HFS metadata initialization, tree maps and continued writes
        if: inputs.family == 'hfs'
        run: python3 acceptance/native/verify_hfs_metadata_growth.py --expected-major "${{ matrix.major }}" --corpus artifacts/offline-editing-hfs --outputs artifacts/outputs
      - name: Qualify HFS fragmented metadata and overflow extents
        if: inputs.family == 'hfs-fragmented'
        run: python3 acceptance/native/verify_hfs_metadata_growth.py --fragmented --expected-major "${{ matrix.major }}" --corpus artifacts/offline-editing-hfs-fragmented --outputs artifacts/outputs
      - name: Qualify exact ACLs, set-ID transitions and continued native inheritance
        if: inputs.family == 'permissions'
        run: python3 acceptance/native/verify_permission_inheritance.py --expected-major "${{ matrix.major }}" --corpus artifacts/offline-editing-permissions --outputs artifacts/outputs
      - name: Qualify native cp ACL composition, preserved dates and continued writes
        if: inputs.family == 'copy-permissions'
        run: python3 acceptance/native/verify_permission_inheritance.py --copies --expected-major "${{ matrix.major }}" --corpus artifacts/offline-editing-copy-permissions --outputs artifacts/outputs
      - name: Qualify exact native directory statistics and continued writes
        if: inputs.family == 'statistics'
        run: python3 acceptance/native/verify_apfs_offline_editing.py --statistics --expected-major "${{ matrix.major }}" --corpus artifacts/offline-editing-statistics --outputs artifacts/outputs
      - name: Qualify native transition totals, wrapped checkpoints and continued allocation
        if: inputs.family == 'statistics-transitions'
        run: python3 acceptance/native/verify_directory_statistics.py --expected-major "${{ matrix.major }}" --corpus artifacts/offline-editing-statistics-transitions --outputs artifacts/outputs
      - name: Retain native verdicts and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-editing-${{ inputs.family }}-readback-${{ matrix.major }}
          path: artifacts/outputs/*.json
          if-no-files-found: error
      - name: Require every declared Apple verification scope
        run: >-
          python3 acceptance/native/qualification_complete.py
          --plan "artifacts/outputs/offline-editing-${{ inputs.family }}-macos-${{ matrix.major }}.plan.json"
      - name: Retain required case execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-offline-editing-${{ inputs.family }}-${{ github.job }}-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            artifacts/qualification/capture-*/
            artifacts/qualification/replay-*/plan.json
            artifacts/qualification/replay-*/receipt.json
            artifacts/qualification/replay-*/events.jsonl
            artifacts/qualification/replay-*/inputs.json
            artifacts/qualification/replay-*/source-inputs.json
            artifacts/**/.qualification/*/*.json
            artifacts/**/.qualification/*/*.jsonl
            artifacts/**/*.plan.json
            artifacts/**/*.receipt.json
            artifacts/**/*.events.jsonl
          if-no-files-found: error

  qualified:
    name: Require offline image capture, portable editing and Apple readback
    if: always()
    needs: [capture, replay, archive, readback]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          CAPTURE: ${{ needs.capture.result }}
          REPLAY: ${{ needs.replay.result }}
          READBACK: ${{ needs.readback.result }}
          ARCHIVED_RUN: ${{ inputs.readback_run }}
          ARCHIVE: ${{ needs.archive.result }}
        run: |
          if [ -n "$ARCHIVED_RUN" ]; then
            test "$ARCHIVE" = success && test "$READBACK" = success
          else
            test "$CAPTURE" = success && test "$REPLAY" = success && test "$READBACK" = success
          fi
