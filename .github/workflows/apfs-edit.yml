name: Existing APFS filesystem editing

on:
  workflow_call:
    inputs:
      reuse_references:
        description: Use independently qualified inputs only after the caller admits the reviewed pin
        type: boolean
        default: false
      capture_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      capture_only:
        description: 'Capture Apple-created APFS editing reference disks only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apfs-edit-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    name: ${{ inputs.reuse_references && 'Restore reviewed Apple-created' || 'Record Apple-created' }} APFS file, directory and metadata edits (macOS ${{ inputs.reuse_references && '15, 26 and 27' || matrix.major }})
    runs-on: ${{ matrix.major == 'all' && 'ubuntu-24.04' || matrix.major == 15 && 'macos-15' || matrix.major == 26 && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        major: ${{ inputs.reuse_references && fromJSON('["all"]') || fromJSON('[15,26,27]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: ${{ inputs.reuse_references }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore verified original Apple reference inputs
        if: ${{ inputs.reuse_references }}
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for source_major in 15 26 27; do
            python3 acceptance/qualification/reference_reuse.py materialize \
              --assets "$RUNNER_TEMP/native-reference-assets" \
              --artifact "apfs-edit-reference-$source_major" \
              --major "$source_major" \
              --destination "artifacts/reviewed-inputs-$source_major" \
              --scratch "$RUNNER_TEMP" \
              --proof "artifacts/qualification/capture-approved-$source_major/admission.json"
          done
      - name: Require a disposable GitHub-hosted VM
        if: ${{ !(inputs.reuse_references) }}
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Capture existing identities, native allocation and file edits
        if: ${{ !(inputs.reuse_references) }}
        run: python3 acceptance/native/apfs_editing.py --expected-major "${{ matrix.major }}" --output artifacts/apfs-editing/macos-${{ matrix.major }}
      - name: Capture native creation, rename, hard-link unlink and directory metadata
        if: ${{ !(inputs.reuse_references) }}
        run: python3 acceptance/native/apfs_directory_editing.py --expected-major "${{ matrix.major }}" --output artifacts/apfs-editing/directories/macos-${{ matrix.major }}
      - name: Record native ownership, timestamps, flags and attribute storage transitions
        if: ${{ !(inputs.reuse_references) }}
        run: python3 acceptance/native/image_metadata.py --expected-major "${{ matrix.major }}" --kind apfs --references artifacts/apfs-editing/macos-${{ matrix.major }} --output artifacts/apfs-editing/metadata/macos-${{ matrix.major }}
      - name: Record Apple hard-link conversion, symbolic links and complete link lifetimes
        if: ${{ !(inputs.reuse_references) }}
        run: python3 acceptance/native/image_links.py --expected-major "${{ matrix.major }}" --kind apfs --references artifacts/apfs-editing/macos-${{ matrix.major }} --output artifacts/apfs-editing/links/macos-${{ matrix.major }}
      - name: Record Apple application, framework and directory copying
        if: ${{ !(inputs.reuse_references) }}
        run: python3 acceptance/native/image_copy.py --expected-major "${{ matrix.major }}" --kind apfs --references artifacts/apfs-editing/macos-${{ matrix.major }} --output artifacts/apfs-editing/copy/macos-${{ matrix.major }}
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "apfs-editing=artifacts/apfs-editing"
          --output "artifacts/qualification/capture-apfs-editing"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "apfs-directory-editing=artifacts/apfs-editing/directories"
          --output "artifacts/qualification/capture-apfs-directory-editing"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "apfs-metadata-editing=artifacts/apfs-editing/metadata"
          --output "artifacts/qualification/capture-apfs-metadata-editing"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "apfs-link-editing=artifacts/apfs-editing/links"
          --output "artifacts/qualification/capture-apfs-link-editing"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "apfs-copy=artifacts/apfs-editing/copy"
          --output "artifacts/qualification/capture-apfs-copy"
      - name: Retain source disks, native states and command diagnostics
        if: ${{ always() && !(inputs.reuse_references) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-edit-reference-${{ matrix.major }}
          path: artifacts/apfs-editing
          compression-level: 0
          if-no-files-found: error
      - name: Retain reviewed original input bytes (macOS 15)
        if: ${{ inputs.reuse_references }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-edit-reference-15
          path: artifacts/reviewed-inputs-15
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Retain reviewed original input bytes (macOS 26)
        if: ${{ inputs.reuse_references }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-edit-reference-26
          path: artifacts/reviewed-inputs-26
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Retain reviewed original input bytes (macOS 27)
        if: ${{ inputs.reuse_references }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-edit-reference-27
          path: artifacts/reviewed-inputs-27
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Retain required capture execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-apfs-edit-${{ github.job }}-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            artifacts/qualification/capture-*/
            artifacts/qualification/replay-*/plan.json
            artifacts/qualification/replay-*/receipt.json
            artifacts/qualification/replay-*/events.jsonl
            artifacts/qualification/replay-*/inputs.json
            artifacts/qualification/replay-*/source-inputs.json
            artifacts/**/*.plan.json
            artifacts/**/*.receipt.json
            artifacts/**/*.events.jsonl
          if-no-files-found: error

  replay:
    if: ${{ !inputs.capture_only }}
    name: Edit APFS files, directories and metadata (${{ matrix.host }}, macOS ${{ matrix.major }} sources)
    needs: capture
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, host: Linux, major: 15, race: '-race'}
          - {runner: ubuntu-24.04, host: Linux, major: 26, race: '-race'}
          - {runner: ubuntu-24.04, host: Linux, major: 27, race: '-race'}
          - {runner: windows-2025, host: Windows, major: 15, race: ''}
          - {runner: windows-2025, host: Windows, major: 26, race: ''}
          - {runner: windows-2025, host: Windows, major: 27, race: ''}
          - {runner: macos-26, host: macOS, major: 15, race: ''}
          - {runner: macos-26, host: macOS, major: 26, race: ''}
          - {runner: macos-26, host: macOS, major: 27, race: ''}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: apfs-edit-reference-${{ matrix.major }}
          path: artifacts/apfs-editing
      - name: Verify native file semantics, unchanged identities, source preservation and reproducibility
        run: go run ./acceptance/qualification -replay -- ${{ matrix.race }} -v -count=1 -timeout 5m ./acceptance -run '^TestNativeAPFSImage(Directory)?Editing$'
        env:
          CGO_ENABLED: ${{ matrix.host == 'Linux' && '1' || '0' }}
          APFS_REQUIRED_NATIVE_MAJORS: ${{ matrix.major }}
          APFS_NATIVE_APFS_EDITS: ../artifacts/apfs-editing
          APFS_APFS_EDIT_OUTPUT: ../artifacts/apfs-edits-${{ matrix.host }}
          APFS_NATIVE_APFS_DIRECTORY_EDITS: ../artifacts/apfs-editing/directories
          APFS_APFS_DIRECTORY_OUTPUT: ../artifacts/apfs-directories-${{ matrix.host }}
      - name: Compare ownership, clocks, flags, FinderInfo and allocated attributes
        run: go run ./acceptance/qualification -replay -- ${{ matrix.race }} -v -count=1 -timeout 5m ./acceptance -run '^TestNativeAPFSImageMetadataEditing$'
        env:
          CGO_ENABLED: ${{ matrix.host == 'Linux' && '1' || '0' }}
          APFS_REQUIRED_NATIVE_MAJORS: ${{ matrix.major }}
          APFS_NATIVE_APFS_METADATA: ../artifacts/apfs-editing/metadata
          APFS_APFS_METADATA_OUTPUT: ../artifacts/apfs-metadata-${{ matrix.host }}
      # Link replay has its own bounded invocation in the existing job.
      - name: Compare new links, original identities and complete alias lifetimes
        run: go run ./acceptance/qualification -replay -- ${{ matrix.race }} -v -count=1 -timeout 5m ./acceptance -run '^TestNativeAPFSImageLinkEditing$'
        env:
          CGO_ENABLED: ${{ matrix.host == 'Linux' && '1' || '0' }}
          APFS_REQUIRED_NATIVE_MAJORS: ${{ matrix.major }}
          APFS_NATIVE_APFS_LINKS: ../artifacts/apfs-editing/links
          APFS_APFS_LINK_OUTPUT: ../artifacts/apfs-links-${{ matrix.host }}
      - name: Compare preserved copying, recursive imports and copied application signatures
        run: go run ./acceptance/qualification -replay -- ${{ matrix.race }} -v -count=1 -timeout 5m ./acceptance -run '^TestNativeAPFSImageCopy$'
        env:
          CGO_ENABLED: ${{ matrix.host == 'Linux' && '1' || '0' }}
          APFS_REQUIRED_NATIVE_MAJORS: ${{ matrix.major }}
          APFS_NATIVE_APFS_COPY: ../artifacts/apfs-editing/copy
          APFS_APFS_COPY_OUTPUT: ../artifacts/apfs-copy-${{ matrix.host }}
      - name: Archive actual portable output images
        shell: bash
        run: |
          archive_options=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            archive_options=(--no-mac-metadata --no-xattrs --no-acls)
          fi
          tar -czf artifacts/apfs-edits-${{ matrix.host }}-${{ matrix.major }}.tar.gz "${archive_options[@]}" -C artifacts apfs-edits-${{ matrix.host }} apfs-directories-${{ matrix.host }} apfs-metadata-${{ matrix.host }} apfs-links-${{ matrix.host }} apfs-copy-${{ matrix.host }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-edits-${{ matrix.host }}-${{ matrix.major }}
          path: artifacts/apfs-edits-*.tar.gz
          compression-level: 0
          if-no-files-found: error
      - name: Retain required case execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-apfs-edit-${{ github.job }}-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            artifacts/qualification/replay-*/plan.json
            artifacts/qualification/replay-*/receipt.json
            artifacts/qualification/replay-*/events.jsonl
            artifacts/qualification/replay-*/inputs.json
            artifacts/qualification/replay-*/source-inputs.json
          if-no-files-found: error

  readback:
    if: ${{ !inputs.capture_only }}
    name: Qualify APFS edits and continued native writes (macOS ${{ matrix.major }})
    needs: replay
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, major: 15}
          - {runner: macos-26, major: 26}
          - {runner: xcode-27, major: 27}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: apfs-edit-reference-*
          path: artifacts/apfs-editing
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: apfs-edits-*
          path: artifacts/outputs
          merge-multiple: true
      - name: Unpack all host/source-version images
        run: |
          for archive_file in artifacts/outputs/*.tar.gz; do
            tar -xzf "$archive_file" --no-mac-metadata --no-xattrs --no-acls --options '!mac-ext' -C artifacts/outputs
          done
      - name: Qualify exact raw copies with Apple fsck, native readback and continued allocation
        run: python3 acceptance/native/verify_apfs_editing.py --expected-major "${{ matrix.major }}" --corpus artifacts/apfs-editing --outputs artifacts/outputs --continuation artifacts/apfs-continued-native
      - name: Edit Apple's subsequent allocation and tree state again with Go
        run: go run ./acceptance/qualification -replay -- -v -count=1 -timeout 2m ./acceptance -run '^TestNativeAPFSImageEditingContinuation$'
        env:
          APFS_APFS_EDIT_CONTINUATION: ../artifacts/apfs-continued-native
          APFS_APFS_EDIT_CONTINUED_OUTPUT: ../artifacts/apfs-continued-go
      - name: Qualify Go re-edits with Apple fsck and remount
        run: python3 acceptance/native/verify_apfs_editing.py --expected-major "${{ matrix.major }}" --continued artifacts/apfs-continued-go
      - name: Qualify directory edits, native link changes and allocation reuse
        run: python3 acceptance/native/verify_apfs_directory_editing.py --expected-major "${{ matrix.major }}" --corpus artifacts/apfs-editing/directories --outputs artifacts/outputs --continuation artifacts/apfs-directories-continued-native
      - name: Create, move and remove entries in Apple's subsequent state with Go
        run: go run ./acceptance/qualification -replay -- -v -count=1 -timeout 2m ./acceptance -run '^TestNativeAPFSImageDirectoryEditingContinuation$'
        env:
          APFS_APFS_DIRECTORY_CONTINUATION: ../artifacts/apfs-directories-continued-native
          APFS_APFS_DIRECTORY_CONTINUED_OUTPUT: ../artifacts/apfs-directories-continued-go
      - name: Qualify subsequent Go directory edits with Apple fsck and remount
        run: python3 acceptance/native/verify_apfs_directory_editing.py --expected-major "${{ matrix.major }}" --continued artifacts/apfs-directories-continued-go
      - name: Qualify metadata images and capture independent continued native controls
        run: python3 acceptance/native/verify_image_metadata.py --expected-major "${{ matrix.major }}" --kind apfs --prefix apfs --corpus artifacts/apfs-editing/metadata --outputs artifacts/outputs --continuation artifacts/metadata-continued-native
      - name: Re-edit native attribute streams and compare the complete Apple result
        run: go run ./acceptance/qualification -replay -- -v -count=1 -timeout 3m ./acceptance -run '^TestNativeImageMetadataEditingContinuation$'
        env:
          APFS_IMAGE_METADATA_KIND: apfs
          APFS_IMAGE_METADATA_CONTINUATION: ../artifacts/metadata-continued-native
          APFS_IMAGE_METADATA_CONTINUED_OUTPUT: ../artifacts/metadata-continued-go
      - name: Qualify complete continued metadata state with Apple tools
        run: python3 acceptance/native/verify_image_metadata.py --expected-major "${{ matrix.major }}" --kind apfs --prefix apfs --continued artifacts/metadata-continued-go --controls artifacts/metadata-continued-native
      - name: Qualify hard links, literal symlinks and signed frameworks with Apple tools
        run: python3 acceptance/native/verify_image_links.py --expected-major "${{ matrix.major }}" --kind apfs --prefix apfs --corpus artifacts/apfs-editing/links --outputs artifacts/outputs --continuation artifacts/links-continued-native
      - name: Re-edit native link changes against a separate Apple-only control
        run: go run ./acceptance/qualification -replay -- -v -count=1 -timeout 3m ./acceptance -run '^TestNativeImageLinkEditingContinuation$'
        env:
          APFS_IMAGE_LINK_KIND: apfs
          APFS_IMAGE_LINK_CONTINUATION: ../artifacts/links-continued-native
          APFS_IMAGE_LINK_CONTINUED_OUTPUT: ../artifacts/links-continued-go
      - name: Qualify the complete continued link result with Apple fsck and signatures
        run: python3 acceptance/native/verify_image_links.py --expected-major "${{ matrix.major }}" --kind apfs --prefix apfs --continued artifacts/links-continued-go --controls artifacts/links-continued-native
      - name: Qualify copied applications, frameworks and native copy continuation
        run: python3 acceptance/native/verify_image_copy.py --expected-major "${{ matrix.major }}" --kind apfs --prefix apfs --corpus artifacts/apfs-editing/copy --outputs artifacts/outputs --continuation artifacts/copy-continued-native
      - name: Copy again from Apple's subsequent state against a separate native control
        run: go run ./acceptance/qualification -replay -- -v -count=1 -timeout 3m ./acceptance -run '^TestNativeImageCopyContinuation$'
        env:
          APFS_IMAGE_COPY_KIND: apfs
          APFS_IMAGE_COPY_CONTINUATION: ../artifacts/copy-continued-native
          APFS_IMAGE_COPY_CONTINUED_OUTPUT: ../artifacts/copy-continued-go
      - name: Qualify continued copying with Apple fsck, metadata, forks and signatures
        run: python3 acceptance/native/verify_image_copy.py --expected-major "${{ matrix.major }}" --kind apfs --prefix apfs --continued artifacts/copy-continued-go --controls artifacts/copy-continued-native
      - name: Retain exact native continuation inputs and expectations
        if: always()
        run: |
          if [ -d artifacts/metadata-continued-native ]; then
            tar -czf artifacts/metadata-continued-native.tgz -C artifacts metadata-continued-native
          fi
          if [ -d artifacts/links-continued-native ]; then
            tar -czf artifacts/links-continued-native.tgz -C artifacts links-continued-native
          fi
          if [ -d artifacts/copy-continued-native ]; then
            tar -czf artifacts/copy-continued-native.tgz -C artifacts copy-continued-native
          fi
      - name: Retain native verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-edit-verification-${{ matrix.major }}
          path: |
            artifacts/outputs/*.diagnostics.json
            artifacts/apfs-continued-go/*.diagnostics.json
            artifacts/apfs-directories-continued-go/*.diagnostics.json
            artifacts/metadata-continued-go/*.diagnostics.json
            artifacts/metadata-continued-native.tgz
            artifacts/links-continued-go/*.diagnostics.json
            artifacts/links-continued-native.tgz
            artifacts/copy-continued-go/*.diagnostics.json
            artifacts/copy-continued-native.tgz
          if-no-files-found: error
      - name: Require every declared Apple verification scope
        run: >-
          python3 acceptance/native/qualification_complete.py
          --plan "artifacts/outputs/apfs_editing-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/outputs/apfs_directory_editing-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/outputs/image_metadata-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/outputs/image_links-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/outputs/image_copy-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/apfs-continued-go/apfs_editing-continued-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/apfs-directories-continued-go/apfs_directory_editing-continued-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/metadata-continued-go/image_metadata-continued-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/links-continued-go/image_links-continued-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/copy-continued-go/image_copy-continued-macos-${{ matrix.major }}.plan.json"
      - name: Retain required case execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-apfs-edit-${{ github.job }}-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            artifacts/qualification/capture-*/
            artifacts/qualification/replay-*/plan.json
            artifacts/qualification/replay-*/receipt.json
            artifacts/qualification/replay-*/events.jsonl
            artifacts/qualification/replay-*/inputs.json
            artifacts/qualification/replay-*/source-inputs.json
            artifacts/**/*.plan.json
            artifacts/**/*.receipt.json
            artifacts/**/*.events.jsonl
          if-no-files-found: error

  complete:
    if: ${{ always() && !inputs.capture_only }}
    name: Require all existing APFS editing checks
    needs: [capture, replay, readback]
    runs-on: ubuntu-24.04
    steps:
      - run: test "$CAPTURE" = success && test "$REPLAY" = success && test "$READBACK" = success
        env:
          CAPTURE: ${{ needs.capture.result }}
          REPLAY: ${{ needs.replay.result }}
          READBACK: ${{ needs.readback.result }}
