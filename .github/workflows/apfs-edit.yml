name: Existing APFS filesystem editing

on:
  workflow_call:
    inputs:
      capture_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      capture_only:
        description: 'Capture Apple-created APFS editing reference disks only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apfs-edit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Record Apple-created APFS file edits (macOS ${{ matrix.major }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, major: 15}
          - {runner: macos-26, major: 26}
          - {runner: xcode-27, major: 27}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Capture existing identities, native allocation and file edits
        run: python3 acceptance/native/apfs_editing.py --expected-major "${{ matrix.major }}" --output artifacts/apfs-editing/macos-${{ matrix.major }}
      - name: Retain source disks, native states and command diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-edit-reference-${{ matrix.major }}
          path: artifacts/apfs-editing
          if-no-files-found: error
