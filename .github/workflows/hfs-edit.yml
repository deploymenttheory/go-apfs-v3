name: Existing HFS filesystem editing

on:
  workflow_call:
    inputs:
      reuse_references:
        description: Use independently qualified inputs only after the caller admits the reviewed pin
        type: boolean
        default: false
      capture_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      journal_capture:
        description: 'Run the HFS journal recovery family only (capture_only limits it to Apple references)'
        type: boolean
        default: false
      capture_only:
        description: 'Capture Apple-created HFS editing reference disks only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hfs-edit-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  journal_recovery:
    if: ${{ inputs.journal_capture }}
    uses: ./.github/workflows/hfs-recovery.yml
    with:
      capture_only: ${{ inputs.capture_only }}

  capture:
    if: ${{ !inputs.journal_capture }}
    name: ${{ inputs.reuse_references && 'Restore reviewed Apple-created' || 'Record Apple-created' }} ${{ matrix.profile }} HFS edit controls (macOS ${{ inputs.reuse_references && '15, 26 and 27' || matrix.major }})
    runs-on: ${{ matrix.major == 'all' && 'ubuntu-24.04' || matrix.major == 15 && 'macos-15' || matrix.major == 26 && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        major: ${{ inputs.reuse_references && fromJSON('["all"]') || fromJSON('[15,26,27]') }}
        profile: [nonjournaled, journaled]
        include:
          - {prefix: "hfs", profile: "nonjournaled", journal: "", operations: "file contents, modes and metadata"}
          - {prefix: "hfs-journaled", profile: "journaled", journal: "--journaled", operations: "file contents, modes and metadata"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: ${{ inputs.reuse_references }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore verified original Apple reference inputs
        if: ${{ inputs.reuse_references }}
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for source_major in 15 26 27; do
            python3 acceptance/qualification/reference_reuse.py materialize \
              --assets "$RUNNER_TEMP/native-reference-assets" \
              --artifact "${{ matrix.prefix }}-edit-reference-$source_major" \
              --major "$source_major" \
              --destination "artifacts/reviewed-inputs-$source_major" \
              --scratch "$RUNNER_TEMP" \
              --proof "artifacts/qualification/capture-approved-$source_major/admission.json"
          done
      - name: Require a disposable GitHub-hosted VM
        if: ${{ !(inputs.reuse_references) }}
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Capture original identities, fragmented forks and native changes
        if: ${{ !(inputs.reuse_references) }}
        run: python3 acceptance/native/hfs_editing.py --expected-major "${{ matrix.major }}" --output artifacts/${{ matrix.prefix }}-editing/macos-${{ matrix.major }} ${{ matrix.journal }}
      - name: Record native ownership, timestamps, flags and attribute storage transitions
        if: ${{ !(inputs.reuse_references) }}
        run: python3 acceptance/native/image_metadata.py --expected-major "${{ matrix.major }}" --kind hfs --references artifacts/${{ matrix.prefix }}-editing/macos-${{ matrix.major }} --output artifacts/${{ matrix.prefix }}-editing/metadata/macos-${{ matrix.major }}
      - name: Record Apple hard-link conversion, symbolic links and complete link lifetimes
        if: ${{ !(inputs.reuse_references) }}
        run: python3 acceptance/native/image_links.py --expected-major "${{ matrix.major }}" --kind hfs --references artifacts/${{ matrix.prefix }}-editing/macos-${{ matrix.major }} --output artifacts/${{ matrix.prefix }}-editing/links/macos-${{ matrix.major }}
      - name: Record Apple application, framework and directory copying
        if: ${{ !(inputs.reuse_references) }}
        run: python3 acceptance/native/image_copy.py --expected-major "${{ matrix.major }}" --kind hfs --references artifacts/${{ matrix.prefix }}-editing/macos-${{ matrix.major }} --output artifacts/${{ matrix.prefix }}-editing/copy/macos-${{ matrix.major }}
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "${{ matrix.prefix }}-editing=artifacts/${{ matrix.prefix }}-editing"
          --input "${{ matrix.prefix }}-catalog-editing=artifacts/${{ matrix.prefix }}-editing"
          --output "artifacts/qualification/capture-${{ matrix.prefix }}-editing"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "${{ matrix.prefix }}-metadata-editing=artifacts/${{ matrix.prefix }}-editing/metadata"
          --output "artifacts/qualification/capture-${{ matrix.prefix }}-metadata-editing"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "${{ matrix.prefix }}-link-editing=artifacts/${{ matrix.prefix }}-editing/links"
          --output "artifacts/qualification/capture-${{ matrix.prefix }}-link-editing"
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "${{ matrix.prefix }}-copy=artifacts/${{ matrix.prefix }}-editing/copy"
          --output "artifacts/qualification/capture-${{ matrix.prefix }}-copy"
      - name: Retain original raw disks, native states, observations and command diagnostics
        if: ${{ always() && !(inputs.reuse_references) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.prefix }}-edit-reference-${{ matrix.major }}
          path: artifacts/${{ matrix.prefix }}-editing
          compression-level: 0
          if-no-files-found: error
      - name: Retain reviewed original input bytes (macOS 15)
        if: ${{ inputs.reuse_references }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.prefix }}-edit-reference-15
          path: artifacts/reviewed-inputs-15
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Retain reviewed original input bytes (macOS 26)
        if: ${{ inputs.reuse_references }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.prefix }}-edit-reference-26
          path: artifacts/reviewed-inputs-26
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Retain reviewed original input bytes (macOS 27)
        if: ${{ inputs.reuse_references }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.prefix }}-edit-reference-27
          path: artifacts/reviewed-inputs-27
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Retain required capture execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-hfs-edit-${{ github.job }}-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            artifacts/qualification/capture-*/
            artifacts/qualification/replay-*/plan.json
            artifacts/qualification/replay-*/receipt.json
            artifacts/qualification/replay-*/events.jsonl
            artifacts/qualification/replay-*/inputs.json
            artifacts/qualification/replay-*/source-inputs.json
            artifacts/**/.qualification/*/*.json
            artifacts/**/.qualification/*/*.jsonl
            artifacts/**/*.plan.json
            artifacts/**/*.receipt.json
            artifacts/**/*.events.jsonl
          if-no-files-found: error

  replay:
    if: ${{ !inputs.capture_only }}
    name: Edit existing Apple HFS filesystems (${{ matrix.profile }}, ${{ matrix.platform }}, ${{ matrix.scope }}, ${{ matrix.operations }})
    needs: capture
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 15 sources', major: 15, tests: '^TestNativeHFSImageEditing$/macos-15', artifact: Linux-15, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents, modes and metadata'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 15 sources', major: 15, tests: '^TestNativeHFSJournaledImageEditing$/macos-15', artifact: Linux-15, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents, modes and metadata'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 26 sources', major: 26, tests: '^TestNativeHFSImageEditing$/macos-26', artifact: Linux-26, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents, modes and metadata'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 26 sources', major: 26, tests: '^TestNativeHFSJournaledImageEditing$/macos-26', artifact: Linux-26, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents, modes and metadata'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 27 sources', major: 27, tests: '^TestNativeHFSImageEditing$/macos-27', artifact: Linux-27, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents, modes and metadata'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 27 sources', major: 27, tests: '^TestNativeHFSJournaledImageEditing$/macos-27', artifact: Linux-27, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents, modes and metadata'}
          - {runner: windows-2025, platform: Windows, race: '', scope: 'all sources', tests: '^TestNativeHFSImageEditing$', artifact: Windows, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents, modes and metadata'}
          - {runner: windows-2025, platform: Windows, race: '', scope: 'all sources', tests: '^TestNativeHFSJournaledImageEditing$', artifact: Windows, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents, modes and metadata'}
          - {runner: macos-26, platform: macOS, race: '', scope: 'all sources', tests: '^TestNativeHFSImageEditing$', artifact: macOS, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents, modes and metadata'}
          - {runner: macos-26, platform: macOS, race: '', scope: 'all sources', tests: '^TestNativeHFSJournaledImageEditing$', artifact: macOS, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents, modes and metadata'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v7
        with:
          pattern: ${{ matrix.prefix }}-edit-reference-*
          path: artifacts/${{ matrix.prefix }}-editing
          merge-multiple: true
      - name: Verify existing identities, forks, compression cleanup, allocation and reproducibility
        # Race coverage owns this bounded family on Linux, instead of repeating
        # its full-disk I/O and compression in the combined quality job. Each
        # Linux job covers both filesystems from one native source version.
        run: go run ./acceptance/qualification -replay -- ${{ matrix.race }} -v -count=1 -timeout 4m ./acceptance -run '${{ matrix.tests }}'
        env:
          CGO_ENABLED: ${{ matrix.platform == 'Linux' && '1' || '0' }}
          APFS_NATIVE_HFS_EDITS: ../artifacts/${{ matrix.prefix }}-editing
          APFS_NATIVE_HFS_JOURNALED_EDITS: ../artifacts/${{ matrix.prefix }}-editing
          APFS_HFS_EDIT_OUTPUT: ../artifacts/${{ matrix.prefix }}-edits-${{ matrix.platform }}
          APFS_HFS_CATALOG_OUTPUT: ../artifacts/${{ matrix.prefix }}-catalog-${{ matrix.platform }}
          APFS_HFS_JOURNALED_CATALOG_OUTPUT: ../artifacts/${{ matrix.prefix }}-catalog-${{ matrix.platform }}
          APFS_HFS_JOURNALED_EDIT_OUTPUT: ../artifacts/${{ matrix.prefix }}-edits-${{ matrix.platform }}
      - name: Compare catalog creation, moves and removal with its original deadline
        shell: bash
        run: go run ./acceptance/qualification -replay -- ${{ matrix.race }} -v -count=1 -timeout 4m ./acceptance -run "$CATALOG_TESTS"
        env:
          CGO_ENABLED: ${{ matrix.platform == 'Linux' && '1' || '0' }}
          CATALOG_TESTS: "^TestNativeHFS${{ matrix.profile == 'journaled' && 'Journaled' || '' }}ImageCatalogEditing$${{ matrix.platform == 'Linux' && format('/macos-{0}', matrix.major) || '' }}"
          APFS_NATIVE_HFS_EDITS: ../artifacts/${{ matrix.prefix }}-editing
          APFS_NATIVE_HFS_JOURNALED_EDITS: ../artifacts/${{ matrix.prefix }}-editing
          APFS_HFS_CATALOG_OUTPUT: ../artifacts/${{ matrix.prefix }}-catalog-${{ matrix.platform }}
          APFS_HFS_JOURNALED_CATALOG_OUTPUT: ../artifacts/${{ matrix.prefix }}-catalog-${{ matrix.platform }}
      - name: Compare native metadata and allocated attribute transitions
        if: matrix.operations == 'file contents, modes and metadata'
        shell: bash
        run: go run ./acceptance/qualification -replay -- ${{ matrix.race }} -v -count=1 -timeout 5m ./acceptance -run "$METADATA_TESTS"
        env:
          CGO_ENABLED: ${{ matrix.platform == 'Linux' && '1' || '0' }}
          METADATA_TESTS: "^TestNativeHFS${{ matrix.profile == 'journaled' && 'Journaled' || '' }}ImageMetadataEditing$${{ matrix.platform == 'Linux' && format('/macos-{0}', matrix.major) || '' }}"
          APFS_NATIVE_HFS_METADATA: ../artifacts/${{ matrix.prefix }}-editing/metadata
          APFS_NATIVE_HFS_JOURNALED_METADATA: ../artifacts/${{ matrix.prefix }}-editing/metadata
          APFS_HFS_METADATA_OUTPUT: ../artifacts/${{ matrix.prefix }}-metadata-${{ matrix.platform }}
          APFS_HFS_JOURNALED_METADATA_OUTPUT: ../artifacts/${{ matrix.prefix }}-metadata-${{ matrix.platform }}
      - name: Compare first-link conversion, alias chains and literal symlinks
        if: matrix.operations == 'file contents, modes and metadata'
        shell: bash
        run: go run ./acceptance/qualification -replay -- ${{ matrix.race }} -v -count=1 -timeout 5m ./acceptance -run "$LINK_TESTS"
        env:
          CGO_ENABLED: ${{ matrix.platform == 'Linux' && '1' || '0' }}
          LINK_TESTS: "^TestNativeHFS${{ matrix.profile == 'journaled' && 'Journaled' || '' }}ImageLinkEditing$${{ matrix.platform == 'Linux' && format('/macos-{0}', matrix.major) || '' }}"
          APFS_NATIVE_HFS_LINKS: ../artifacts/${{ matrix.prefix }}-editing/links
          APFS_NATIVE_HFS_JOURNALED_LINKS: ../artifacts/${{ matrix.prefix }}-editing/links
          APFS_HFS_LINK_OUTPUT: ../artifacts/${{ matrix.prefix }}-links-${{ matrix.platform }}
          APFS_HFS_JOURNALED_LINK_OUTPUT: ../artifacts/${{ matrix.prefix }}-links-${{ matrix.platform }}
      - name: Archive actual portable output images
        shell: bash
        run: |
          archive_options=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            archive_options=(--no-mac-metadata --no-xattrs --no-acls)
          fi
          output_directories=("${{ matrix.prefix }}-edits-${{ matrix.platform }}"
                              "${{ matrix.prefix }}-catalog-${{ matrix.platform }}"
                              "${{ matrix.prefix }}-metadata-${{ matrix.platform }}"
                              "${{ matrix.prefix }}-links-${{ matrix.platform }}")
          tar -czf "artifacts/${{ matrix.prefix }}-edits-${{ matrix.artifact }}.tar.gz" "${archive_options[@]}" -C artifacts "${output_directories[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.prefix }}-edits-${{ matrix.artifact }}
          path: artifacts/${{ matrix.prefix }}-edits-*.tar.gz
          compression-level: 0
          if-no-files-found: error

  replay_copy:
    if: ${{ !inputs.capture_only }}
    name: Copy applications and directories into existing HFS (${{ matrix.profile }}, ${{ matrix.platform }}, ${{ matrix.scope }})
    needs: capture
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 15 sources', tests: '^TestNativeHFSImageCopy$/macos-15', artifact: Linux-15, prefix: hfs, profile: nonjournaled}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 15 sources', tests: '^TestNativeHFSJournaledImageCopy$/macos-15', artifact: Linux-15, prefix: hfs-journaled, profile: journaled}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 26 sources', tests: '^TestNativeHFSImageCopy$/macos-26', artifact: Linux-26, prefix: hfs, profile: nonjournaled}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 26 sources', tests: '^TestNativeHFSJournaledImageCopy$/macos-26', artifact: Linux-26, prefix: hfs-journaled, profile: journaled}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 27 sources', tests: '^TestNativeHFSImageCopy$/macos-27', artifact: Linux-27, prefix: hfs, profile: nonjournaled}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 27 sources', tests: '^TestNativeHFSJournaledImageCopy$/macos-27', artifact: Linux-27, prefix: hfs-journaled, profile: journaled}
          - {runner: windows-2025, platform: Windows, race: '', scope: 'all sources', tests: '^TestNativeHFSImageCopy$', artifact: Windows, prefix: hfs, profile: nonjournaled}
          - {runner: windows-2025, platform: Windows, race: '', scope: 'all sources', tests: '^TestNativeHFSJournaledImageCopy$', artifact: Windows, prefix: hfs-journaled, profile: journaled}
          - {runner: macos-26, platform: macOS, race: '', scope: 'all sources', tests: '^TestNativeHFSImageCopy$', artifact: macOS, prefix: hfs, profile: nonjournaled}
          - {runner: macos-26, platform: macOS, race: '', scope: 'all sources', tests: '^TestNativeHFSJournaledImageCopy$', artifact: macOS, prefix: hfs-journaled, profile: journaled}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v7
        with:
          pattern: ${{ matrix.prefix }}-edit-reference-*
          path: artifacts/${{ matrix.prefix }}-editing
          merge-multiple: true
      - name: Compare preserved copying, recursive imports and copied application signatures
        # Copying owns a separate bounded job: adding it to the existing three
        # race-instrumented edit families exceeded their ten-minute job budget.
        shell: bash
        run: go run ./acceptance/qualification -replay -- ${{ matrix.race }} -v -count=1 -timeout 5m ./acceptance -run '${{ matrix.tests }}'
        env:
          CGO_ENABLED: ${{ matrix.platform == 'Linux' && '1' || '0' }}
          APFS_NATIVE_HFS_COPY: ../artifacts/${{ matrix.prefix }}-editing/copy
          APFS_NATIVE_HFS_JOURNALED_COPY: ../artifacts/${{ matrix.prefix }}-editing/copy
          APFS_HFS_COPY_OUTPUT: ../artifacts/${{ matrix.prefix }}-copy-${{ matrix.platform }}
          APFS_HFS_JOURNALED_COPY_OUTPUT: ../artifacts/${{ matrix.prefix }}-copy-${{ matrix.platform }}
      - name: Archive actual portable copied images
        shell: bash
        run: |
          archive_options=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            archive_options=(--no-mac-metadata --no-xattrs --no-acls)
          fi
          tar -czf "artifacts/${{ matrix.prefix }}-edits-Copy-${{ matrix.artifact }}.tar.gz" "${archive_options[@]}" -C artifacts "${{ matrix.prefix }}-copy-${{ matrix.platform }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.prefix }}-edits-Copy-${{ matrix.artifact }}
          path: artifacts/${{ matrix.prefix }}-edits-Copy-*.tar.gz
          compression-level: 0
          if-no-files-found: error

  readback:
    if: ${{ !inputs.capture_only }}
    name: Qualify ${{ matrix.profile }} HFS edits and continued writes (macOS ${{ matrix.major }})
    needs: [replay, replay_copy]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, major: 15, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents, modes and metadata'}
          - {runner: macos-15, major: 15, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents, modes and metadata'}
          - {runner: macos-26, major: 26, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents, modes and metadata'}
          - {runner: macos-26, major: 26, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents, modes and metadata'}
          - {runner: xcode-27, major: 27, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents, modes and metadata'}
          - {runner: xcode-27, major: 27, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents, modes and metadata'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v7
        with:
          pattern: ${{ matrix.prefix }}-edit-reference-*
          path: artifacts/${{ matrix.prefix }}-editing
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: ${{ matrix.prefix }}-edits-*
          path: artifacts/outputs
          merge-multiple: true
      - name: Unpack complete portable images
        run: |
          for archive_file in artifacts/outputs/*.tar.gz; do
            tar -xzf "$archive_file" --no-mac-metadata --no-xattrs --no-acls --options '!mac-ext' -C artifacts/outputs
          done
      - name: Check exact raw copies with Apple fsck, mounted readback, signatures and native edits
        run: python3 acceptance/native/verify_hfs_editing.py --expected-major "${{ matrix.major }}" --corpus artifacts/${{ matrix.prefix }}-editing --outputs artifacts/outputs --continuation artifacts/continued-native ${{ matrix.journal }}
      - name: Read native allocation and tree changes, then modify the same filesystems again with Go
        run: |
          mkdir -p artifacts/continued-go
          go run ./acceptance/qualification -replay -- -v -count=1 -timeout 2m ./acceptance -run '^TestNativeHFSImageEditingContinuation$'
        env:
          APFS_HFS_EDIT_CONTINUATION: ../artifacts/continued-native
          APFS_HFS_EDIT_CONTINUED_OUTPUT: ../artifacts/continued-go
      - name: Qualify Go re-edits with another Apple checker and native remount
        run: python3 acceptance/native/verify_hfs_editing.py --expected-major "${{ matrix.major }}" --continued artifacts/continued-go ${{ matrix.journal }}
      - name: Check catalog creation, moves, removal and subsequent native allocation
        run: python3 acceptance/native/verify_hfs_catalog_editing.py --expected-major "${{ matrix.major }}" --corpus artifacts/${{ matrix.prefix }}-editing --outputs artifacts/outputs --continuation artifacts/catalog-continued-native ${{ matrix.journal }}
      - name: Edit native catalog changes again with Go
        run: go run ./acceptance/qualification -replay -- -v -count=1 -timeout 2m ./acceptance -run '^TestNativeHFSImageCatalogEditingContinuation$'
        env:
          APFS_HFS_CATALOG_CONTINUATION: ../artifacts/catalog-continued-native
          APFS_HFS_CATALOG_CONTINUED_OUTPUT: ../artifacts/catalog-continued-go
      - name: Qualify continued Go catalog operations with Apple fsck and remount
        run: python3 acceptance/native/verify_hfs_catalog_editing.py --expected-major "${{ matrix.major }}" --continued artifacts/catalog-continued-go ${{ matrix.journal }}
      - name: Qualify metadata storage, FinderInfo and continued native attribute writes
        run: python3 acceptance/native/verify_image_metadata.py --expected-major "${{ matrix.major }}" --kind hfs --prefix ${{ matrix.prefix }} --corpus artifacts/${{ matrix.prefix }}-editing/metadata --outputs artifacts/outputs --continuation artifacts/metadata-continued-native
      - name: Re-edit native metadata and compare the complete independent result
        run: go run ./acceptance/qualification -replay -- -v -count=1 -timeout 3m ./acceptance -run '^TestNativeImageMetadataEditingContinuation$'
        env:
          APFS_IMAGE_METADATA_KIND: hfs
          APFS_IMAGE_METADATA_CONTINUATION: ../artifacts/metadata-continued-native
          APFS_IMAGE_METADATA_CONTINUED_OUTPUT: ../artifacts/metadata-continued-go
      - name: Qualify complete continued metadata state with Apple tools
        run: python3 acceptance/native/verify_image_metadata.py --expected-major "${{ matrix.major }}" --kind hfs --prefix ${{ matrix.prefix }} --continued artifacts/metadata-continued-go --controls artifacts/metadata-continued-native
      - name: Qualify hard links, literal symlinks and signed frameworks with Apple tools
        run: python3 acceptance/native/verify_image_links.py --expected-major "${{ matrix.major }}" --kind hfs --prefix ${{ matrix.prefix }} --corpus artifacts/${{ matrix.prefix }}-editing/links --outputs artifacts/outputs --continuation artifacts/links-continued-native
      - name: Re-edit native link changes against a separate Apple-only control
        run: go run ./acceptance/qualification -replay -- -v -count=1 -timeout 3m ./acceptance -run '^TestNativeImageLinkEditingContinuation$'
        env:
          APFS_IMAGE_LINK_KIND: hfs
          APFS_IMAGE_LINK_CONTINUATION: ../artifacts/links-continued-native
          APFS_IMAGE_LINK_CONTINUED_OUTPUT: ../artifacts/links-continued-go
      - name: Qualify the complete continued link result with Apple fsck and signatures
        run: python3 acceptance/native/verify_image_links.py --expected-major "${{ matrix.major }}" --kind hfs --prefix ${{ matrix.prefix }} --continued artifacts/links-continued-go --controls artifacts/links-continued-native
      - name: Explain the independently verified capability
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Existing HFS+/HFSX editing verified

          Apple created six ${{ matrix.profile }} fragmented source volumes across macOS 15, 26 and 27.
          Linux, Windows and macOS updated their original records and allocated
          existing free space. Each host produced 24 images with identical bytes.
          Linux also race-instrumented the same fresh-corpus editing operations.
          This Mac qualified every distinct image using exact raw copies, native
          fsck, mounted contents/identity/metadata/fork checks and codesign.

          Six final images also underwent native append, directory-tree growth,
          deletion and allocation reuse. Go read those results and edited the
          same filesystems again; Apple fsck and remount qualified that output.
          Journaled controls also require unchanged journal storage and backing identities,
          and actual subsequent native journal writes. Sources remained immutable.
          Twelve additional catalog images qualified creation, moves, Unicode names,
          overwrite, unlink/final-link storage reclamation, compressed-file removal
          and native/Go/native continued tree edits. Their bytes matched on all hosts.
          Metadata outputs additionally qualify numeric ownership, precise clocks,
          BSD flags, FinderInfo, long-key growth and inline/allocated attribute transitions.
          Independent continued Apple writes become Go inputs, and separate Apple-only
          copies supply complete expectations for the final native/Go/native cycle.
          Native tooling ran only in disposable VMs.
          Link outputs additionally qualify first-link inode conversion, complete
          alias lifetimes, literal/dangling symlinks and restored signed frameworks.
          EOF
      - name: Qualify copied applications, frameworks and native copy continuation
        run: python3 acceptance/native/verify_image_copy.py --expected-major "${{ matrix.major }}" --kind hfs --prefix ${{ matrix.prefix }} --corpus artifacts/${{ matrix.prefix }}-editing/copy --outputs artifacts/outputs --continuation artifacts/copy-continued-native
      - name: Copy again from Apple's subsequent state against a separate native control
        run: go run ./acceptance/qualification -replay -- -v -count=1 -timeout 3m ./acceptance -run '^TestNativeImageCopyContinuation$'
        env:
          APFS_IMAGE_COPY_KIND: hfs
          APFS_IMAGE_COPY_CONTINUATION: ../artifacts/copy-continued-native
          APFS_IMAGE_COPY_CONTINUED_OUTPUT: ../artifacts/copy-continued-go
      - name: Qualify continued copying with Apple fsck, metadata, forks and signatures
        run: python3 acceptance/native/verify_image_copy.py --expected-major "${{ matrix.major }}" --kind hfs --prefix ${{ matrix.prefix }} --continued artifacts/copy-continued-go --controls artifacts/copy-continued-native
      - name: Retain exact native continuation inputs and expectations
        if: always()
        run: |
          if [ -d artifacts/metadata-continued-native ]; then
            tar -czf artifacts/metadata-continued-native.tgz -C artifacts metadata-continued-native
          fi
          if [ -d artifacts/links-continued-native ]; then
            tar -czf artifacts/links-continued-native.tgz -C artifacts links-continued-native
          fi
          if [ -d artifacts/copy-continued-native ]; then
            tar -czf artifacts/copy-continued-native.tgz -C artifacts copy-continued-native
          fi
      - name: Retain failed or successful native verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.prefix }}-edit-verification-${{ matrix.major }}
          path: |
            artifacts/outputs/*.diagnostics.json
            artifacts/continued-go/*.diagnostics.json
            artifacts/catalog-continued-go/*.diagnostics.json
            artifacts/metadata-continued-go/*.diagnostics.json
            artifacts/metadata-continued-native.tgz
            artifacts/links-continued-go/*.diagnostics.json
            artifacts/links-continued-native.tgz
            artifacts/copy-continued-go/*.diagnostics.json
            artifacts/copy-continued-native.tgz
          if-no-files-found: warn
      - name: Require every declared Apple verification scope
        run: >-
          python3 acceptance/native/qualification_complete.py
          --plan "artifacts/outputs/hfs_editing-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/outputs/hfs_catalog_editing-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/outputs/image_metadata-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/outputs/image_links-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/outputs/image_copy-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/continued-go/hfs_editing-continued-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/catalog-continued-go/hfs_catalog_editing-continued-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/metadata-continued-go/image_metadata-continued-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/links-continued-go/image_links-continued-macos-${{ matrix.major }}.plan.json"
          --plan "artifacts/copy-continued-go/image_copy-continued-macos-${{ matrix.major }}.plan.json"
      - name: Retain required case execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-hfs-edit-${{ github.job }}-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            artifacts/qualification/capture-*/
            artifacts/qualification/replay-*/plan.json
            artifacts/qualification/replay-*/receipt.json
            artifacts/qualification/replay-*/events.jsonl
            artifacts/qualification/replay-*/inputs.json
            artifacts/qualification/replay-*/source-inputs.json
            artifacts/**/.qualification/*/*.json
            artifacts/**/.qualification/*/*.jsonl
            artifacts/**/*.plan.json
            artifacts/**/*.receipt.json
            artifacts/**/*.events.jsonl
          if-no-files-found: error

  complete:
    name: Require existing HFS edit qualification
    if: ${{ always() && !inputs.capture_only && !inputs.journal_capture }}
    needs: [capture, replay, replay_copy, readback]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native reference, portable output and native continuation check
        env:
          CAPTURE: ${{ needs.capture.result }}
          REPLAY: ${{ needs.replay.result }}
          COPY: ${{ needs.replay_copy.result }}
          READBACK: ${{ needs.readback.result }}
        run: test "$CAPTURE" = success && test "$REPLAY" = success && test "$COPY" = success && test "$READBACK" = success
