name: Existing HFS filesystem editing

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hfs-edit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  capture:
    name: Record Apple-created fragmented HFS edit controls (macOS ${{ matrix.major }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, major: 15}
          - {runner: macos-26, major: 26}
          - {runner: xcode-27, major: 27}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Capture original identities, fragmented forks and native changes
        run: python3 acceptance/native/hfs_editing.py --expected-major "${{ matrix.major }}" --output artifacts/hfs-editing/macos-${{ matrix.major }}
      - name: Retain original raw disks, native states, observations and command diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hfs-edit-reference-${{ matrix.major }}
          path: artifacts/hfs-editing
          if-no-files-found: error

  replay:
    name: Edit existing Apple HFS filesystems (${{ matrix.platform }})
    needs: capture
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: Linux}
          - {runner: windows-2025, platform: Windows}
          - {runner: macos-26, platform: macOS}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v7
        with:
          pattern: hfs-edit-reference-*
          path: artifacts/hfs-editing
          merge-multiple: true
      - name: Verify existing identities, forks, compression cleanup, allocation and reproducibility
        run: go test -v -count=1 -timeout 4m ./acceptance -run '^TestNativeHFSImageEditing$'
        env:
          APFS_NATIVE_HFS_EDITS: ../artifacts/hfs-editing
          APFS_HFS_EDIT_OUTPUT: ../artifacts/hfs-edits-${{ matrix.platform }}
      - name: Archive actual portable output images
        shell: bash
        run: |
          archive_options=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            archive_options=(--no-mac-metadata --no-xattrs --no-acls)
          fi
          tar -czf "artifacts/hfs-edits-${{ matrix.platform }}.tar.gz" "${archive_options[@]}" -C artifacts "hfs-edits-${{ matrix.platform }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hfs-edits-${{ matrix.platform }}
          path: artifacts/hfs-edits-*.tar.gz
          if-no-files-found: error

  readback:
    name: Qualify portable HFS edits and continued writes (macOS ${{ matrix.major }})
    needs: replay
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, major: 15}
          - {runner: macos-26, major: 26}
          - {runner: xcode-27, major: 27}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v7
        with:
          pattern: hfs-edit-reference-*
          path: artifacts/hfs-editing
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: hfs-edits-*
          path: artifacts/outputs
          merge-multiple: true
      - name: Unpack complete portable images
        run: |
          for archive_file in artifacts/outputs/*.tar.gz; do
            tar -xzf "$archive_file" --no-mac-metadata --no-xattrs --no-acls --options '!mac-ext' -C artifacts/outputs
          done
      - name: Check exact raw copies with Apple fsck, mounted readback, signatures and native edits
        run: python3 acceptance/native/verify_hfs_editing.py --expected-major "${{ matrix.major }}" --corpus artifacts/hfs-editing --outputs artifacts/outputs --continuation artifacts/continued-native
      - name: Read native allocation and tree changes, then modify the same filesystems again with Go
        run: |
          mkdir -p artifacts/continued-go
          go test -v -count=1 -timeout 2m ./acceptance -run '^TestNativeHFSImageEditingContinuation$'
        env:
          APFS_HFS_EDIT_CONTINUATION: ../artifacts/continued-native
          APFS_HFS_EDIT_CONTINUED_OUTPUT: ../artifacts/continued-go
      - name: Qualify Go re-edits with another Apple checker and native remount
        run: python3 acceptance/native/verify_hfs_editing.py --expected-major "${{ matrix.major }}" --continued artifacts/continued-go
      - name: Explain the independently verified capability
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Existing HFS+/HFSX editing verified

          Apple created six fragmented source volumes across macOS 15, 26 and 27.
          Linux, Windows and macOS updated their original records and allocated
          existing free space. Each host produced 24 images with identical bytes.
          This Mac qualified every distinct image using exact raw copies, native
          fsck, mounted contents/identity/metadata/fork checks and codesign.

          Six final images also underwent native append, directory-tree growth,
          deletion and allocation reuse. Go read those results and edited the
          same filesystems again; Apple fsck and remount qualified that output.
          Sources remained immutable. Native tooling ran only in disposable VMs.
          EOF
      - name: Retain failed or successful native verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hfs-edit-verification-${{ matrix.major }}
          path: |
            artifacts/outputs/*.diagnostics.json
            artifacts/continued-go/*.diagnostics.json
          if-no-files-found: warn

  complete:
    name: Require existing HFS edit qualification
    if: always()
    needs: [capture, replay, readback]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native reference, portable output and native continuation check
        env:
          CAPTURE: ${{ needs.capture.result }}
          REPLAY: ${{ needs.replay.result }}
          READBACK: ${{ needs.readback.result }}
        run: test "$CAPTURE" = success && test "$REPLAY" = success && test "$READBACK" = success
