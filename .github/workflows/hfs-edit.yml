name: Existing HFS filesystem editing

on:
  workflow_call:
    inputs:
      capture_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      capture_only:
        description: 'Capture Apple-created HFS editing reference disks only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hfs-edit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  capture:
    name: Record Apple-created ${{ matrix.profile }} HFS edit controls (macOS ${{ matrix.major }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, major: 15, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents and modes'}
          - {runner: macos-15, major: 15, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents and modes'}
          - {runner: macos-26, major: 26, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents and modes'}
          - {runner: macos-26, major: 26, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents and modes'}
          - {runner: xcode-27, major: 27, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents and modes'}
          - {runner: xcode-27, major: 27, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents and modes'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Capture original identities, fragmented forks and native changes
        run: python3 acceptance/native/hfs_editing.py --expected-major "${{ matrix.major }}" --output artifacts/${{ matrix.prefix }}-editing/macos-${{ matrix.major }} ${{ matrix.journal }}
      - name: Record native ownership, timestamps, flags and attribute storage transitions
        run: python3 acceptance/native/image_metadata.py --expected-major "${{ matrix.major }}" --kind hfs --references artifacts/${{ matrix.prefix }}-editing/macos-${{ matrix.major }} --output artifacts/${{ matrix.prefix }}-editing/metadata/macos-${{ matrix.major }}
      - name: Retain original raw disks, native states, observations and command diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.prefix }}-edit-reference-${{ matrix.major }}
          path: artifacts/${{ matrix.prefix }}-editing
          if-no-files-found: error

  replay:
    if: ${{ !inputs.capture_only }}
    name: Edit existing Apple HFS filesystems (${{ matrix.profile }}, ${{ matrix.platform }}, ${{ matrix.scope }}, ${{ matrix.operations }})
    needs: capture
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 15 sources', tests: '^TestNativeHFSImageEditing$/macos-15', artifact: Linux-15, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents and modes'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 15 sources', tests: '^TestNativeHFSJournaledImageEditing$/macos-15', artifact: Linux-15, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents and modes'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 26 sources', tests: '^TestNativeHFSImageEditing$/macos-26', artifact: Linux-26, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents and modes'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 26 sources', tests: '^TestNativeHFSJournaledImageEditing$/macos-26', artifact: Linux-26, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents and modes'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 27 sources', tests: '^TestNativeHFSImageEditing$/macos-27', artifact: Linux-27, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents and modes'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 27 sources', tests: '^TestNativeHFSJournaledImageEditing$/macos-27', artifact: Linux-27, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents and modes'}
          - {runner: windows-2025, platform: Windows, race: '', scope: 'all sources', tests: '^TestNativeHFSImageEditing$', artifact: Windows, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents and modes'}
          - {runner: windows-2025, platform: Windows, race: '', scope: 'all sources', tests: '^TestNativeHFSJournaledImageEditing$', artifact: Windows, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents and modes'}
          - {runner: macos-26, platform: macOS, race: '', scope: 'all sources', tests: '^TestNativeHFSImageEditing$', artifact: macOS, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents and modes'}
          - {runner: macos-26, platform: macOS, race: '', scope: 'all sources', tests: '^TestNativeHFSJournaledImageEditing$', artifact: macOS, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents and modes'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 15 sources', tests: '^TestNativeHFSImageCatalogEditing$/macos-15', artifact: Catalog-Linux-15, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file and directory entries'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 15 sources', tests: '^TestNativeHFSJournaledImageCatalogEditing$/macos-15', artifact: Catalog-Linux-15, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file and directory entries'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 26 sources', tests: '^TestNativeHFSImageCatalogEditing$/macos-26', artifact: Catalog-Linux-26, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file and directory entries'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 26 sources', tests: '^TestNativeHFSJournaledImageCatalogEditing$/macos-26', artifact: Catalog-Linux-26, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file and directory entries'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 27 sources', tests: '^TestNativeHFSImageCatalogEditing$/macos-27', artifact: Catalog-Linux-27, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file and directory entries'}
          - {runner: ubuntu-24.04, platform: Linux, race: '-race', scope: 'macOS 27 sources', tests: '^TestNativeHFSJournaledImageCatalogEditing$/macos-27', artifact: Catalog-Linux-27, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file and directory entries'}
          - {runner: windows-2025, platform: Windows, race: '', scope: 'all sources', tests: '^TestNativeHFSImageCatalogEditing$', artifact: Catalog-Windows, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file and directory entries'}
          - {runner: windows-2025, platform: Windows, race: '', scope: 'all sources', tests: '^TestNativeHFSJournaledImageCatalogEditing$', artifact: Catalog-Windows, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file and directory entries'}
          - {runner: macos-26, platform: macOS, race: '', scope: 'all sources', tests: '^TestNativeHFSImageCatalogEditing$', artifact: Catalog-macOS, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file and directory entries'}
          - {runner: macos-26, platform: macOS, race: '', scope: 'all sources', tests: '^TestNativeHFSJournaledImageCatalogEditing$', artifact: Catalog-macOS, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file and directory entries'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v7
        with:
          pattern: ${{ matrix.prefix }}-edit-reference-*
          path: artifacts/${{ matrix.prefix }}-editing
          merge-multiple: true
      - name: Verify existing identities, forks, compression cleanup, allocation and reproducibility
        # Race coverage owns this bounded family on Linux, instead of repeating
        # its full-disk I/O and compression in the combined quality job. Each
        # Linux job covers both filesystems from one native source version.
        run: go test ${{ matrix.race }} -v -count=1 -timeout 4m ./acceptance -run '${{ matrix.tests }}'
        env:
          CGO_ENABLED: ${{ matrix.platform == 'Linux' && '1' || '0' }}
          APFS_NATIVE_HFS_EDITS: ../artifacts/${{ matrix.prefix }}-editing
          APFS_NATIVE_HFS_JOURNALED_EDITS: ../artifacts/${{ matrix.prefix }}-editing
          APFS_HFS_EDIT_OUTPUT: ../artifacts/${{ matrix.prefix }}-edits-${{ matrix.platform }}
          APFS_HFS_CATALOG_OUTPUT: ../artifacts/${{ matrix.prefix }}-catalog-${{ matrix.platform }}
          APFS_HFS_JOURNALED_CATALOG_OUTPUT: ../artifacts/${{ matrix.prefix }}-catalog-${{ matrix.platform }}
          APFS_HFS_JOURNALED_EDIT_OUTPUT: ../artifacts/${{ matrix.prefix }}-edits-${{ matrix.platform }}
      - name: Archive actual portable output images
        env:
          HFS_OUTPUT_ARTIFACT: ${{ matrix.artifact }}
        shell: bash
        run: |
          archive_options=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            archive_options=(--no-mac-metadata --no-xattrs --no-acls)
          fi
          if [[ "$HFS_OUTPUT_ARTIFACT" == Catalog-* ]]; then
            output_directory="${{ matrix.prefix }}-catalog-${{ matrix.platform }}"
          else
            output_directory="${{ matrix.prefix }}-edits-${{ matrix.platform }}"
          fi
          tar -czf "artifacts/${{ matrix.prefix }}-edits-${{ matrix.artifact }}.tar.gz" "${archive_options[@]}" -C artifacts "$output_directory"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.prefix }}-edits-${{ matrix.artifact }}
          path: artifacts/${{ matrix.prefix }}-edits-*.tar.gz
          if-no-files-found: error

  readback:
    if: ${{ !inputs.capture_only }}
    name: Qualify ${{ matrix.profile }} HFS edits and continued writes (macOS ${{ matrix.major }})
    needs: replay
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, major: 15, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents and modes'}
          - {runner: macos-15, major: 15, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents and modes'}
          - {runner: macos-26, major: 26, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents and modes'}
          - {runner: macos-26, major: 26, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents and modes'}
          - {runner: xcode-27, major: 27, prefix: hfs, profile: nonjournaled, journal: '', operations: 'file contents and modes'}
          - {runner: xcode-27, major: 27, prefix: hfs-journaled, profile: journaled, journal: '--journaled', operations: 'file contents and modes'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v7
        with:
          pattern: ${{ matrix.prefix }}-edit-reference-*
          path: artifacts/${{ matrix.prefix }}-editing
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: ${{ matrix.prefix }}-edits-*
          path: artifacts/outputs
          merge-multiple: true
      - name: Unpack complete portable images
        run: |
          for archive_file in artifacts/outputs/*.tar.gz; do
            tar -xzf "$archive_file" --no-mac-metadata --no-xattrs --no-acls --options '!mac-ext' -C artifacts/outputs
          done
      - name: Check exact raw copies with Apple fsck, mounted readback, signatures and native edits
        run: python3 acceptance/native/verify_hfs_editing.py --expected-major "${{ matrix.major }}" --corpus artifacts/${{ matrix.prefix }}-editing --outputs artifacts/outputs --continuation artifacts/continued-native ${{ matrix.journal }}
      - name: Read native allocation and tree changes, then modify the same filesystems again with Go
        run: |
          mkdir -p artifacts/continued-go
          go test -v -count=1 -timeout 2m ./acceptance -run '^TestNativeHFSImageEditingContinuation$'
        env:
          APFS_HFS_EDIT_CONTINUATION: ../artifacts/continued-native
          APFS_HFS_EDIT_CONTINUED_OUTPUT: ../artifacts/continued-go
      - name: Qualify Go re-edits with another Apple checker and native remount
        run: python3 acceptance/native/verify_hfs_editing.py --expected-major "${{ matrix.major }}" --continued artifacts/continued-go ${{ matrix.journal }}
      - name: Check catalog creation, moves, removal and subsequent native allocation
        run: python3 acceptance/native/verify_hfs_catalog_editing.py --expected-major "${{ matrix.major }}" --corpus artifacts/${{ matrix.prefix }}-editing --outputs artifacts/outputs --continuation artifacts/catalog-continued-native ${{ matrix.journal }}
      - name: Edit native catalog changes again with Go
        run: go test -v -count=1 -timeout 2m ./acceptance -run '^TestNativeHFSImageCatalogEditingContinuation$'
        env:
          APFS_HFS_CATALOG_CONTINUATION: ../artifacts/catalog-continued-native
          APFS_HFS_CATALOG_CONTINUED_OUTPUT: ../artifacts/catalog-continued-go
      - name: Qualify continued Go catalog operations with Apple fsck and remount
        run: python3 acceptance/native/verify_hfs_catalog_editing.py --expected-major "${{ matrix.major }}" --continued artifacts/catalog-continued-go ${{ matrix.journal }}
      - name: Explain the independently verified capability
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Existing HFS+/HFSX editing verified

          Apple created six ${{ matrix.profile }} fragmented source volumes across macOS 15, 26 and 27.
          Linux, Windows and macOS updated their original records and allocated
          existing free space. Each host produced 24 images with identical bytes.
          Linux also race-instrumented the same fresh-corpus editing operations.
          This Mac qualified every distinct image using exact raw copies, native
          fsck, mounted contents/identity/metadata/fork checks and codesign.

          Six final images also underwent native append, directory-tree growth,
          deletion and allocation reuse. Go read those results and edited the
          same filesystems again; Apple fsck and remount qualified that output.
          Journaled controls also require unchanged journal storage and backing identities,
          and actual subsequent native journal writes. Sources remained immutable.
          Twelve additional catalog images qualified creation, moves, Unicode names,
          overwrite, unlink/final-link storage reclamation, compressed-file removal
          and native/Go/native continued tree edits. Their bytes matched on all hosts.
          Native tooling ran only in disposable VMs.
          EOF
      - name: Retain failed or successful native verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.prefix }}-edit-verification-${{ matrix.major }}
          path: |
            artifacts/outputs/*.diagnostics.json
            artifacts/continued-go/*.diagnostics.json
            artifacts/catalog-continued-go/*.diagnostics.json
          if-no-files-found: warn

  complete:
    name: Require existing HFS edit qualification
    if: ${{ always() && !inputs.capture_only }}
    needs: [capture, replay, readback]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native reference, portable output and native continuation check
        env:
          CAPTURE: ${{ needs.capture.result }}
          REPLAY: ${{ needs.replay.result }}
          READBACK: ${{ needs.readback.result }}
        run: test "$CAPTURE" = success && test "$REPLAY" = success && test "$READBACK" = success
