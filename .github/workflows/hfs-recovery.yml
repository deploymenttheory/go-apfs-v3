name: HFS journal recovery

on:
  workflow_call:
    inputs:
      reuse_references:
        description: Use independently qualified inputs only after the caller admits the reviewed pin
        type: boolean
        default: false
      capture_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      capture_only:
        description: 'Record actual Apple pending journals and native replay only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hfs-recovery-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    name: Capture interrupted Apple HFS journals and native recovery (macOS ${{ matrix.major }})
    runs-on: ${{ inputs.reuse_references && 'ubuntu-24.04' || matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, major: 15}
          - {runner: macos-26, major: 26}
          - {runner: xcode-27, major: 27}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: ${{ inputs.reuse_references }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore verified original Apple reference inputs
        if: ${{ inputs.reuse_references }}
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 acceptance/qualification/reference_reuse.py materialize
          --assets "$RUNNER_TEMP/native-reference-assets"
          --artifact "hfs-recovery-reference-${{ matrix.major }}"
          --major "${{ matrix.major }}"
          --destination "artifacts/hfs-recovery/macos-${{ matrix.major }}"
          --scratch "$RUNNER_TEMP"
          --proof "artifacts/qualification/capture-approved-${{ matrix.major }}/admission.json"
      - name: Require a disposable GitHub-hosted VM
        if: ${{ !(inputs.reuse_references) }}
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Capture genuine pending journal rings and Apple-recovered copies
        if: ${{ !(inputs.reuse_references) }}
        run: python3 acceptance/native/hfs_journal_recovery.py --expected-major "${{ matrix.major }}" --output artifacts/hfs-recovery/macos-${{ matrix.major }}
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "hfs-recovery=artifacts/hfs-recovery"
          --output "artifacts/qualification/capture-hfs-recovery"
      - name: Retain interrupted disks, Apple recovery and diagnostic commands
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hfs-recovery-reference-${{ matrix.major }}
          path: artifacts/hfs-recovery/macos-${{ matrix.major }}
          compression-level: 0
          if-no-files-found: error
      - name: Retain required capture execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-hfs-recovery-${{ github.job }}-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            artifacts/qualification/capture-*/
            artifacts/qualification/replay-*/plan.json
            artifacts/qualification/replay-*/receipt.json
            artifacts/qualification/replay-*/events.jsonl
            artifacts/qualification/replay-*/inputs.json
            artifacts/qualification/replay-*/source-inputs.json
            artifacts/**/.qualification/*/*.json
            artifacts/**/.qualification/*/*.jsonl
            artifacts/**/*.plan.json
            artifacts/**/*.receipt.json
            artifacts/**/*.events.jsonl
          if-no-files-found: error

  replay:
    if: ${{ !inputs.capture_only }}
    name: Compare Go recovery with Apple replay bytes (${{ matrix.platform }}, ${{ matrix.scope }})
    needs: capture
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: Linux, scope: macOS 15, source: 15, race: '-race', artifact: Linux-15}
          - {runner: ubuntu-24.04, platform: Linux, scope: macOS 26, source: 26, race: '-race', artifact: Linux-26}
          - {runner: ubuntu-24.04, platform: Linux, scope: macOS 27, source: 27, race: '-race', artifact: Linux-27}
          - {runner: windows-2025, platform: Windows, scope: macOS 15, source: 15, race: '', artifact: Windows-15}
          - {runner: windows-2025, platform: Windows, scope: macOS 26, source: 26, race: '', artifact: Windows-26}
          - {runner: windows-2025, platform: Windows, scope: macOS 27, source: 27, race: '', artifact: Windows-27}
          - {runner: macos-26, platform: macOS, scope: macOS 15, source: 15, race: '', artifact: macOS-15}
          - {runner: macos-26, platform: macOS, scope: macOS 26, source: 26, race: '', artifact: macOS-26}
          - {runner: macos-26, platform: macOS, scope: macOS 27, source: 27, race: '', artifact: macOS-27}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v7
        with:
          pattern: hfs-recovery-reference-*
          path: artifacts/hfs-recovery
      - name: Arrange the independently recorded source versions
        shell: bash
        run: |
          for major in 15 26 27; do
            mv "artifacts/hfs-recovery/hfs-recovery-reference-$major" "artifacts/hfs-recovery/macos-$major"
          done
      - name: Compare complete replay bytes, preserved metadata, reproducibility and subsequent Go edits
        shell: bash
        run: go run ./acceptance/qualification -replay -- ${{ matrix.race }} -v -count=1 -timeout 5m ./acceptance -run "$RECOVERY_TESTS"
        env:
          CGO_ENABLED: ${{ matrix.platform == 'Linux' && '1' || '0' }}
          RECOVERY_TESTS: "^TestNativeHFSJournalRecovery$/macos-${{ matrix.source }}(/|$)"
          APFS_NATIVE_HFS_RECOVERY: ../artifacts/hfs-recovery
          APFS_HFS_RECOVERY_OUTPUT: ../artifacts/recovered-${{ matrix.platform }}
      - name: Archive actual completed outputs
        shell: bash
        run: |
          options=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            options=(--no-mac-metadata --no-xattrs --no-acls)
          fi
          tar -czf "artifacts/recovered-${{ matrix.artifact }}.tgz" "${options[@]}" -C artifacts "recovered-${{ matrix.platform }}"
      - name: Build the portable CLI and interrupt a partial scratch copy
        shell: bash
        run: |
          go build -o "artifacts/apfs${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/apfs
          python3 acceptance/native/recovery_interruption.py --apfs "artifacts/apfs${{ runner.os == 'Windows' && '.exe' || '' }}" --references artifacts/hfs-recovery/macos-15 --diagnostics artifacts/interruption
      - name: Retain portable interruption evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hfs-recovery-interruption-${{ matrix.artifact }}
          path: artifacts/interruption
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hfs-recovered-${{ matrix.artifact }}
          path: artifacts/recovered-*.tgz
          compression-level: 0
          if-no-files-found: error

  readback:
    if: ${{ !inputs.capture_only }}
    name: Verify all portable recovery and native continued writes (macOS ${{ matrix.major }})
    needs: [capture, replay]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26, xcode-27]
        include:
          - {runner: macos-15, major: 15}
          - {runner: macos-26, major: 26}
          - {runner: xcode-27, major: 27}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/download-artifact@v7
        with:
          name: hfs-recovery-reference-${{ matrix.major }}
          path: artifacts/references
      - uses: actions/download-artifact@v7
        with:
          pattern: hfs-recovered-*-${{ matrix.major }}
          path: artifacts/archives
          merge-multiple: true
      - name: Unpack all completed host outputs
        run: |
          for archive_file in artifacts/archives/recovered-*.tgz; do
            tar -xzf "$archive_file" -C artifacts
          done
      - name: Apple fsck, complete readback, signatures and subsequent journaled modification
        run: |
          for portable_host in Linux Windows macOS; do
            python3 acceptance/native/verify_hfs_recovery.py --expected-major "${{ matrix.major }}" --references artifacts/references --outputs "artifacts/recovered-$portable_host/macos-${{ matrix.major }}" --diagnostics "artifacts/verification/$portable_host"
            python3 acceptance/native/qualification_complete.py --plan "artifacts/verification/$portable_host/hfs-recovery-macos-${{ matrix.major }}.plan.json"
          done
      - name: Retain native command verdicts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hfs-recovery-verification-${{ matrix.major }}
          path: artifacts/verification
          if-no-files-found: warn
      - name: Retain required case execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-hfs-recovery-${{ github.job }}-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            artifacts/qualification/capture-*/
            artifacts/qualification/replay-*/plan.json
            artifacts/qualification/replay-*/receipt.json
            artifacts/qualification/replay-*/events.jsonl
            artifacts/qualification/replay-*/inputs.json
            artifacts/qualification/replay-*/source-inputs.json
            artifacts/**/.qualification/*/*.json
            artifacts/**/.qualification/*/*.jsonl
            artifacts/**/*.plan.json
            artifacts/**/*.receipt.json
            artifacts/**/*.events.jsonl
          if-no-files-found: error

  complete:
    name: Require HFS journal recovery qualification
    if: ${{ always() && !inputs.capture_only }}
    needs: [capture, replay, readback]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all Apple interruption controls, portable comparisons and native continuations
        env:
          CAPTURE: ${{ needs.capture.result }}
          REPLAY: ${{ needs.replay.result }}
          READBACK: ${{ needs.readback.result }}
        run: test "$CAPTURE" = success && test "$REPLAY" = success && test "$READBACK" = success
