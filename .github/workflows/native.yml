name: Native acceptance

on:
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - 'acceptance/**'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  produce:
    name: Native producer macOS ${{ matrix.major }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            major: 15
          - runner: macos-26
            major: 26
          - runner: xcode-27
            major: 27
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Native capture (no Go implementation involved)
        run: |
          python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --output artifacts/native/volumes/macos-${{ matrix.major }}
          python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario file-reading --output artifacts/native/files/macos-${{ matrix.major }}
          python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario file-semantics --output artifacts/native/semantics/macos-${{ matrix.major }}
      - name: Retain diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-diagnostics-${{ matrix.major }}
          path: artifacts/native/**/*.diagnostics.json
          if-no-files-found: error
      - name: Publish complete native corpus
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-corpus-${{ matrix.major }}
          path: |
            artifacts/native/volumes/macos-${{ matrix.major }}/
            artifacts/native/files/macos-${{ matrix.major }}/
            artifacts/native/semantics/macos-${{ matrix.major }}/
          if-no-files-found: error

  replay:
    name: Native comparison (${{ matrix.os }})
    needs: produce
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v7
        with:
          pattern: native-corpus-*
          path: artifacts/native
          merge-multiple: true
      - name: Compare all required native producers
        run: go test -v -count=1 -timeout 5m ./acceptance
        env:
          APFS_NATIVE_CORPUS: ../artifacts/native/volumes
          APFS_NATIVE_FILES: ../artifacts/native/files
          APFS_NATIVE_SEMANTICS: ../artifacts/native/semantics
          APFS_REQUIRED_NATIVE_MAJORS: '15,26,27'

  complete:
    if: always()
    needs: [produce, replay]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all producer and consumer cells
        env:
          PRODUCERS: ${{ needs.produce.result }}
          CONSUMERS: ${{ needs.replay.result }}
        run: test "$PRODUCERS" = success && test "$CONSUMERS" = success
