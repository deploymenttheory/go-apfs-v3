name: macOS filesystem compatibility

on:
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - 'acceptance/**'
      - '.github/workflows/native.yml'
      - '.github/workflows/hfs-edit.yml'
      - '.github/workflows/hfs-recovery.yml'
      - '.github/workflows/apfs-edit.yml'
      - '.github/workflows/apfs-recovery.yml'
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      phase5_edits_only:
        description: Only phase-5 completion capture, portable editing and Apple readback
        type: boolean
        default: false
      phase5_reference_kind:
        description: Phase-5 native references to collect
        type: choice
        options: [apfs, hfs, stats, hfs-fragmented]
        default: apfs
      phase5_reference_capture:
        description: Capture Apple larger-image and multiple-volume phase-5 controls only
        required: false
        type: boolean
        default: false
      apfs_checkpoint_capture:
        description: 'Capture actual interrupted Apple checkpoints and native selected states only'
        required: false
        type: boolean
        default: false
      apfs_recovery_only:
        description: 'Only APFS checkpoint capture, portable recovery and Apple continued-write qualification'
        required: false
        type: boolean
        default: false
      apfs_edits_only:
        description: 'Only existing APFS capture, portable editing and Apple readback'
        required: false
        type: boolean
        default: false
      apfs_reference_capture:
        description: 'Capture Apple-created existing APFS file edit controls only'
        required: false
        type: boolean
        default: false
      hfs_reference_capture:
        description: 'Capture matched HFS header-growth disks and checker outcomes only'
        required: false
        type: boolean
        default: false
      readback_run:
        description: 'Prior run with successful captures/replays; verifier-only changes permitted'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: native-${{ github.event_name }}-${{ github.ref }}-${{ inputs.phase5_edits_only && 'phase5' || inputs.phase5_reference_capture && format('phase5-reference-{0}', inputs.phase5_reference_kind) || 'full' }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  phase5_reference:
    if: ${{ inputs.phase5_reference_capture }}
    name: Record phase-5 ${{ inputs.phase5_reference_kind }} edit controls (macOS ${{ matrix.major }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, major: 15}
          - {runner: macos-26, major: 26}
          - {runner: xcode-27, major: 27}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Capture Apple larger-image and multiple-volume edit references
        if: ${{ inputs.phase5_reference_kind == 'apfs' }}
        run: python3 acceptance/native/phase5_capture.py --expected-major "${{ matrix.major }}" --output artifacts/phase5/macos-${{ matrix.major }}
      - name: Capture Apple HFS attribute initialization and node-map growth
        if: ${{ inputs.phase5_reference_kind == 'hfs' }}
        run: python3 acceptance/native/phase5_hfs_capture.py --expected-major "${{ matrix.major }}" --output artifacts/phase5/macos-${{ matrix.major }}
      - name: Capture Apple directory statistics and inherited policies
        if: ${{ inputs.phase5_reference_kind == 'stats' }}
        run: python3 acceptance/native/phase5_capture.py --directory-statistics --expected-major "${{ matrix.major }}" --output artifacts/phase5/macos-${{ matrix.major }}
      - name: Capture Apple fragmented metadata growth and overflow extents
        if: ${{ inputs.phase5_reference_kind == 'hfs-fragmented' }}
        run: python3 acceptance/native/phase5_hfs_capture.py --fragmented-only --expected-major "${{ matrix.major }}" --output artifacts/phase5/macos-${{ matrix.major }}
      - name: Retain original disks, observations and command diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase5-reference-${{ matrix.major }}
          path: artifacts/phase5
          if-no-files-found: error

  phase5_edits:
    if: ${{ inputs.phase5_edits_only || (!inputs.phase5_reference_capture && !inputs.apfs_recovery_only && !inputs.apfs_checkpoint_capture && !inputs.hfs_reference_capture && !inputs.apfs_reference_capture && !inputs.apfs_edits_only && inputs.readback_run == '') }}
    uses: ./.github/workflows/phase5.yml

  apfs_recovery:
    if: ${{ !inputs.phase5_edits_only && !inputs.phase5_reference_capture && (inputs.apfs_checkpoint_capture || inputs.apfs_recovery_only || (!inputs.hfs_reference_capture && !inputs.apfs_reference_capture && !inputs.apfs_edits_only && inputs.readback_run == '')) }}
    uses: ./.github/workflows/apfs-recovery.yml
    with:
      capture_only: ${{ inputs.apfs_checkpoint_capture || false }}

  apfs_edits:
    if: ${{ !inputs.phase5_edits_only && !inputs.phase5_reference_capture && (!inputs.apfs_recovery_only && !inputs.apfs_checkpoint_capture && !inputs.hfs_reference_capture && inputs.readback_run == '') }}
    uses: ./.github/workflows/apfs-edit.yml
    with:
      capture_only: ${{ inputs.apfs_reference_capture || false }}

  hfs_edits:
    if: ${{ !inputs.phase5_edits_only && !inputs.phase5_reference_capture && (!inputs.apfs_recovery_only && !inputs.apfs_checkpoint_capture && !inputs.hfs_reference_capture && !inputs.apfs_reference_capture && !inputs.apfs_edits_only) }}
    uses: ./.github/workflows/hfs-edit.yml

  hfs_recovery:
    if: ${{ !inputs.phase5_edits_only && !inputs.phase5_reference_capture && (!inputs.apfs_recovery_only && !inputs.apfs_checkpoint_capture && !inputs.hfs_reference_capture && !inputs.apfs_reference_capture && !inputs.apfs_edits_only && inputs.readback_run == '') }}
    uses: ./.github/workflows/hfs-recovery.yml

  produce:
    if: ${{ !inputs.phase5_edits_only && !inputs.phase5_reference_capture && (!inputs.apfs_recovery_only && !inputs.apfs_checkpoint_capture && inputs.readback_run == '' && !inputs.hfs_reference_capture && !inputs.apfs_reference_capture && !inputs.apfs_edits_only) }}
    name: Record Apple filesystem reference data (macOS ${{ matrix.major }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            major: 15
          - runner: macos-26
            major: 26
          - runner: xcode-27
            major: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM for native filesystem tests
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Record APFS snapshot inventories and historical files
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario snapshot-reading --output artifacts/native/snapshots/macos-${{ matrix.major }}
      - name: Record volume layout and identity
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --output artifacts/native/volumes/macos-${{ matrix.major }}
      - name: Record file contents, metadata and resource forks
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario file-reading --output artifacts/native/files/macos-${{ matrix.major }}
      - name: Record filename lookup, hard links and fragmented forks
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario file-semantics --output artifacts/native/semantics/macos-${{ matrix.major }}
      - name: Record compressed contents and raw compression storage
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario file-compression --output artifacts/native/compression/macos-${{ matrix.major }}
      - name: Record locked and unlocked APFS files and password behavior
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario file-encryption --output artifacts/native/encryption/macos-${{ matrix.major }}
      - name: Record AES-128 and AES-256 password-protected DMG files
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario disk-image-encryption --output artifacts/native/encrypted-dmg/macos-${{ matrix.major }}
      - name: Record portable extraction and Apple metadata packing references
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario preservation --output artifacts/native/preservation/macos-${{ matrix.major }}
      - name: Record native file replacement and compression cleanup
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario content-replacement --output artifacts/native/replacement/macos-${{ matrix.major }}
      - name: Record native file creation, rename, removal and links
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario tree-edits --output artifacts/native/tree-edits/macos-${{ matrix.major }}
      - name: Record native permissions, timestamps, extended attributes and resource-fork edits
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario metadata-edits --output artifacts/native/metadata-edits/macos-${{ matrix.major }}
      - name: Record native cp, chmod, chown, timestamps, attributes and session command references
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario file-commands --output artifacts/native/file-commands/macos-${{ matrix.major }}
      - name: Record APFS and HFS packaging inputs and signed application references
        run: python3 acceptance/native/capture.py --expected-major "${{ matrix.major }}" --scenario image-building --output artifacts/native/image-building/macos-${{ matrix.major }}
      - name: Record complete disks, snapshots, encrypted volumes and unused sectors for repacking
        run: python3 acceptance/native/image_repacking.py --expected-major "${{ matrix.major }}" --references artifacts/native --output artifacts/native/image-repacking/macos-${{ matrix.major }}
      - name: Explain the recorded reference data
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Apple filesystem reference data
          Apple tools created APFS, case-sensitive APFS, HFS+ and HFSX disk images.
          Native macOS filesystem APIs recorded the expected names, identities,
          contents, metadata, resource forks, compression, APFS password unlocks
          password-protected DMG images, retained APFS snapshot histories, and
          preservation references including Apple copyfile pack/unpack controls.
          Native before/after file writes record replacement, link and fork behavior.
          Tree edits record creation metadata, renames, removal, links and name limits.

          Metadata edits record permissions, ownership, timestamps, FinderInfo and forks.

          File commands record an app-copy/edit journey and independent libc mode vectors.

          Image building records APFS/HFS+/HFSX trees, exact timestamps, native name lookups,
          empty roots, signed applications, shared APFS reserves/quotas and System/Data groups.

          Image repacking records complete native disk hashes, partition maps, snapshots, encrypted volumes and unused-sector controls.

          The fourteen steps above isolate what is being checked. The uploaded images,
          observations, capture scripts and hashes provide the reference data for
          the Go reader comparisons on Linux, Windows and macOS.
          EOF
      - name: Upload Apple-tool diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-diagnostics-${{ matrix.major }}
          path: artifacts/native/**/*.diagnostics.json
          if-no-files-found: error
      - name: Upload reference images, observations and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-corpus-${{ matrix.major }}
          path: |
            artifacts/native/volumes/macos-${{ matrix.major }}/
            artifacts/native/files/macos-${{ matrix.major }}/
            artifacts/native/semantics/macos-${{ matrix.major }}/
            artifacts/native/compression/macos-${{ matrix.major }}/
            artifacts/native/encryption/macos-${{ matrix.major }}/
            artifacts/native/encrypted-dmg/macos-${{ matrix.major }}/
            artifacts/native/snapshots/macos-${{ matrix.major }}/
            artifacts/native/preservation/macos-${{ matrix.major }}/
            artifacts/native/replacement/macos-${{ matrix.major }}/
            artifacts/native/tree-edits/macos-${{ matrix.major }}/
            artifacts/native/metadata-edits/macos-${{ matrix.major }}/
            artifacts/native/file-commands/macos-${{ matrix.major }}/
            artifacts/native/image-building/macos-${{ matrix.major }}/
            artifacts/native/image-repacking/macos-${{ matrix.major }}/
          if-no-files-found: error

  replay:
    name: Compare Go with macOS reference data (${{ matrix.platform }})
    needs: [produce, hfs_reference]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
          - os: windows-2025
            platform: Windows
          - os: macos-26
            platform: macOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v7
        with:
          pattern: native-corpus-*
          path: artifacts/native
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: hfs-header-growth-*
          path: artifacts/hfs-references
          merge-multiple: true
      - name: Verify Go results against macOS 15, 26 and 27 observations
        # Required recovery subworkflows own their complete fresh/retained
        # corpus comparisons; do not duplicate full-disk recovery here.
        # The required hfs_edits subworkflow separately replays fresh HFS edit
        # controls on all hosts; ordinary CI covers their retained corpus.
        # Image construction has separate source-version jobs below; this job
        # retains every other acceptance family, including future additions.
        run: go test -v -count=1 -parallel 2 -timeout 6m ./acceptance -skip '^TestNative(APFSImage((Directory|Metadata|Link)?Editing|Copy)|HFS(Journaled)?Image((Catalog|Metadata|Link)?Editing|Copy)|APFSCheckpointRecovery$|HFSJournalRecovery$|ImageCopyContinuation|ImageBuilding$|ContainerBuilding$)'
        env:
          APFS_NATIVE_CORPUS: ../artifacts/native/volumes
          APFS_NATIVE_FILES: ../artifacts/native/files
          APFS_NATIVE_SEMANTICS: ../artifacts/native/semantics
          APFS_NATIVE_COMPRESSION: ../artifacts/native/compression
          APFS_NATIVE_ENCRYPTION: ../artifacts/native/encryption
          APFS_NATIVE_ENCRYPTED_DMG: ../artifacts/native/encrypted-dmg
          APFS_NATIVE_SNAPSHOTS: ../artifacts/native/snapshots
          APFS_REQUIRED_NATIVE_MAJORS: '15,26,27'
          APFS_NATIVE_HFS_GROWTH: ../artifacts/hfs-references/hfs-header-growth
          APFS_NATIVE_PRESERVATION: ../artifacts/native/preservation
          APFS_WORKSPACE_OUTPUT: ../artifacts/preservation
          APFS_NATIVE_REPLACEMENT: ../artifacts/native/replacement
          APFS_REPLACEMENT_OUTPUT: ../artifacts/replacement
          APFS_NATIVE_TREE_EDITS: ../artifacts/native/tree-edits
          APFS_TREE_EDIT_OUTPUT: ../artifacts/tree-edits
          APFS_NATIVE_METADATA_EDITS: ../artifacts/native/metadata-edits
          APFS_METADATA_EDIT_OUTPUT: ../artifacts/metadata-edits
          APFS_NATIVE_COMMANDS: ../artifacts/native/file-commands
          APFS_COMMAND_OUTPUT: ../artifacts/file-commands
          APFS_NATIVE_REPACKING: ../artifacts/native/image-repacking
          APFS_REPACKING_OUTPUT: ../artifacts/image-repacking
      - name: Archive complete workspaces and output images
        shell: bash
        run: |
          mkdir -p artifacts/workspace-outputs
          archive_options=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            archive_options=(--no-mac-metadata --no-xattrs --no-acls)
          fi
          for family in preservation replacement tree-edits metadata-edits file-commands image-repacking; do
            tar -czf "artifacts/workspace-outputs/${family}-${{ matrix.platform }}.tar.gz" "${archive_options[@]}" -C "artifacts/${family}" .
          done
      - name: Retain archived workspaces and output images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workspace-outputs-${{ matrix.platform }}
          path: artifacts/workspace-outputs/*.tar.gz
          if-no-files-found: error
      - name: Explain the compatibility result
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Go reader compatibility verified
          On this host, Go matched the reference observations captured on macOS
          15, 26 and 27 for APFS, case-sensitive APFS, HFS+ and HFSX.

          Comparisons cover volume identity, file contents and metadata, forks,
          filename lookup, hard links, fragmented forks, transparent compression,
          and read-only APFS unlocking with correct, wrong and changed passwords.
          Encrypted DMG cases cover AES-128/256, raw/compressed images and an
          independently encrypted APFS volume inside an encrypted image.
          Snapshot comparisons check two retained historical states and the later
          live filesystem, including names and files removed after a snapshot.
          Apple CommonCrypto independently checks the APFS encryption primitives.
          Extracted workspaces preserve native names, file bytes, raw storage,
          metadata and links. AppleDouble outputs return to every Mac for unpack.
          Every required reference set must be present. A mismatch fails this job.
          Image hashes are checked before and after reading to verify preservation.

          Older macOS kernels can reject LZ4 filesystem types while Apple's public
          codec decodes them. Those recorded outcomes remain distinct; the Go LZ4
          comparison uses the native codec result in those cases.
          EOF

  image_building_replay:
    name: Build images from macOS ${{ matrix.major }} references (${{ matrix.platform }})
    needs: produce
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        major: [15, 26, 27]
        platform: [Linux, Windows, macOS]
        include:
          - os: ubuntu-24.04
            platform: Linux
          - os: windows-2025
            platform: Windows
          - os: macos-26
            platform: macOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v7
        with:
          name: native-corpus-${{ matrix.major }}
          path: artifacts/native
      - name: Build and compare filesystems, containers, compression and encrypted images
        run: go test -v -count=1 -parallel 2 -timeout 6m ./acceptance -run '^TestNative(Image|Container)Building$'
        env:
          APFS_NATIVE_IMAGE_BUILDING: ../artifacts/native/image-building
          APFS_IMAGE_BUILDING_OUTPUT: ../artifacts/image-building
          APFS_REQUIRED_NATIVE_MAJORS: '${{ matrix.major }}'
      - name: Archive images for independent Apple verification
        shell: bash
        run: |
          mkdir -p artifacts/workspace-outputs
          archive_options=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            archive_options=(--no-mac-metadata --no-xattrs --no-acls)
          fi
          tar -czf "artifacts/workspace-outputs/image-building-${{ matrix.platform }}.tar.gz" "${archive_options[@]}" -C artifacts/image-building .
      - name: Retain all constructed images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workspace-outputs-image-building-${{ matrix.platform }}-macos-${{ matrix.major }}
          path: artifacts/workspace-outputs/*.tar.gz
          if-no-files-found: error

  readback:
    if: ${{ !inputs.phase5_edits_only && !inputs.phase5_reference_capture && (!inputs.apfs_recovery_only && !inputs.apfs_checkpoint_capture && !cancelled() && !inputs.hfs_reference_capture && !inputs.apfs_reference_capture && !inputs.apfs_edits_only && ((needs.replay.result == 'success' && needs.image_building_replay.result == 'success') || inputs.readback_run != '')) }}
    name: Verify Linux, Windows and macOS outputs with Apple tools (macOS ${{ matrix.major }})
    needs: [replay, image_building_replay]
    runs-on: ${{ matrix.runner }}
    # Qualify 63 distinct images, including native modification of the 24 new
    # file-compression outputs. The previous 39-image gate used up to 14 minutes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            major: 15
          - runner: macos-26
            major: 26
          - runner: xcode-27
            major: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate archived capture and replay evidence for a verifier-only rerun
        if: ${{ !inputs.phase5_edits_only && !inputs.phase5_reference_capture && inputs.readback_run != '' }}
        run: python3 acceptance/native/readback_source.py
        env:
          READBACK_RUN: ${{ inputs.readback_run }}
          GH_TOKEN: ${{ github.token }}
      - name: Require a disposable GitHub-hosted VM for native filesystem tests
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.readback_run || github.run_id }}
          github-token: ${{ github.token }}
          pattern: native-corpus-*
          path: artifacts/native
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.readback_run || github.run_id }}
          github-token: ${{ github.token }}
          pattern: workspace-outputs-*
          path: artifacts/outputs
      - name: Unpack complete workspace trees
        shell: bash
        run: |
          for archive_file in artifacts/outputs/workspace-outputs-*/*.tar.gz; do
            output_dir="artifacts/outputs/$(basename "$archive_file" .tar.gz)"
            # Construction archives share a host root, with disjoint macOS
            # source-version directories. Preserve the verifier's full tree.
            mkdir -p "$output_dir"
            tar -xzf "$archive_file" --no-mac-metadata --no-xattrs --no-acls --options '!mac-ext' -C "$output_dir"
          done
      - name: Verify preserved values and native AppleDouble unpack independently of Go
        run: python3 acceptance/native/verify_preservation.py --expected-major "${{ matrix.major }}" --corpus artifacts/native/preservation --outputs artifacts/outputs
      - name: Verify replaced contents, forks and links against native before and after files
        run: python3 acceptance/native/verify_replacement.py --expected-major "${{ matrix.major }}" --corpus artifacts/native/replacement --outputs artifacts/outputs
      - name: Verify edited directory trees against native operations
        run: python3 acceptance/native/verify_tree_edits.py --expected-major "${{ matrix.major }}" --corpus artifacts/native/tree-edits --outputs artifacts/outputs
      - name: Verify metadata, extended attributes and resource-fork edits against native operations
        run: python3 acceptance/native/verify_metadata_edits.py --expected-major "${{ matrix.major }}" --corpus artifacts/native/metadata-edits --outputs artifacts/outputs
      - name: Verify exported command sessions against Apple command observations
        run: python3 acceptance/native/verify_file_commands.py --expected-major "${{ matrix.major }}" --corpus artifacts/native/file-commands --outputs artifacts/outputs
      - name: Check built filesystems, file compression, encrypted DMGs, native writes and signatures with Apple tools
        run: python3 acceptance/native/verify_image_building.py --expected-major "${{ matrix.major }}" --corpus artifacts/native/image-building --outputs artifacts/outputs
      - name: Check repacked sectors, snapshots, encrypted DMGs and password changes with Apple tools
        run: python3 acceptance/native/verify_image_repacking.py --expected-major "${{ matrix.major }}" --corpus artifacts/native/image-repacking --outputs artifacts/outputs
      - name: Retain image-building and repacking verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-building-verification-${{ matrix.major }}
          path: |
            artifacts/outputs/image-building-*.diagnostics.json
            artifacts/outputs/image-capacity-*.diagnostics.json
            artifacts/outputs/image-repacking-*.diagnostics.json
          if-no-files-found: warn
      - name: Explain the native output verification
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Portable output verified independently
          Python checked all 36 workspaces against native file observations:
          four filesystem variants from three macOS versions, extracted on
          Linux, Windows and macOS. Original names, metadata, contents, symlink
          targets, hard-link identities and raw attributes must remain exact.
          Apple's copyfile unpack also compared 108 Go-produced AppleDouble files
          with their Apple-produced controls. The replacement check compares 36
          before/after workspace pairs with 252 native content replacements,
          including compression cleanup, hard-link identity and independent forks.
          Source timestamps remain recorded by the explicit preservation policy.
          Tree editing also verifies 36 workspace pairs against 648 native operations,
          including creation attributes, native names and surviving link relationships.
          Metadata editing verifies 36 further pairs against 1044 native operations,
          including actual UID/GID changes, FinderInfo rules and complete fork replacement.
          File commands verify 36 session exports against 828 native commands,
          including directory import, mode parsing, aliases and native timestamp effects.
          Image building requires 189 plaintext host DMGs to agree in triples, then checks
          all 63 distinct images with Apple checksums, fsck, mounted readback and
          codesign. All 27 baseline APFS images and 24 compression-policy images also undergo native writes and remount checks;
          multi-volume controls exercise reserves, quotas and System/Data groups.
          File-compression policies cover attribute/resource storage, exact block
          boundaries, incompressible/stored blocks, independent forks, inactive
          metadata and hard links. Kernel reads and Apple codec decoding must
          match native source contents; native writes and remounts retain forks
          and update aliases without stale compression storage.
          Native tests run in disposable GitHub-hosted VMs. Identical bytes from
          the three portable hosts are verified once per macOS version.
          Image repacking requires 90 plaintext DMGs to agree in triples, then checks
          all 30 distinct images against complete native disk hashes,
          partition and volume inventories, encrypted-volume unlocks, retained
          snapshot histories, signed apps and recorded unused-sector bytes.
          Apple tools also independently decrypt 108 randomized encrypted outputs
          covering both AES key sizes, both UDIF encodings, all filesystem builders,
          snapshot/volume preservation, password replacement and encrypted raw input.
          Complete native device hashes must match the qualified plaintext disks;
          wrong and replaced passwords fail. Another 18 explicitly decrypted outputs
          must agree across hosts and expose the same native disk bytes.
          No Go verifier supplies these results.
          EOF

  complete:
    name: Require all filesystem compatibility checks
    if: ${{ !inputs.phase5_edits_only && !inputs.phase5_reference_capture && (!inputs.apfs_recovery_only && !inputs.apfs_checkpoint_capture && always() && !inputs.hfs_reference_capture && !inputs.apfs_reference_capture && !inputs.apfs_edits_only) }}
    needs: [produce, hfs_reference, replay, image_building_replay, readback, hfs_edits, hfs_recovery, apfs_edits, apfs_recovery, phase5_edits]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every macOS reference capture and Go comparison
        env:
          PRODUCERS: ${{ needs.produce.result }}
          CONSUMERS: ${{ needs.replay.result }}
          BUILDERS: ${{ needs.image_building_replay.result }}
          READBACK: ${{ needs.readback.result }}
          HFS_REFERENCES: ${{ needs.hfs_reference.result }}
          HFS_EDITS: ${{ needs.hfs_edits.result }}
          HFS_RECOVERY: ${{ needs.hfs_recovery.result }}
          APFS_EDITS: ${{ needs.apfs_edits.result }}
          APFS_RECOVERY: ${{ needs.apfs_recovery.result }}
          PHASE5_EDITS: ${{ needs.phase5_edits.result }}
          REUSED_RUN: ${{ inputs.readback_run }}
        run: |
          if [ -z "$REUSED_RUN" ]; then test "$PHASE5_EDITS" = success && test "$APFS_EDITS" = success && test "$HFS_RECOVERY" = success && test "$APFS_RECOVERY" = success; fi
          test "$HFS_EDITS" = success
          if [ -n "$REUSED_RUN" ]; then
            # Each readback job verifies the source run's successful captures,
            # successful replays and unchanged Go code/inputs before downloading.
            test "$READBACK" = success
          else
            test "$PRODUCERS" = success && test "$HFS_REFERENCES" = success && test "$CONSUMERS" = success && test "$BUILDERS" = success && test "$READBACK" = success
          fi

  hfs_reference:
    if: ${{ !inputs.phase5_edits_only && !inputs.phase5_reference_capture && (!inputs.apfs_recovery_only && !inputs.apfs_checkpoint_capture && !inputs.apfs_reference_capture && !inputs.apfs_edits_only && (inputs.readback_run == '' || inputs.hfs_reference_capture)) }}
    name: Retain matched HFS catalog-growth references (macOS ${{ matrix.major }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            major: 15
          - runner: macos-26
            major: 26
          - runner: xcode-27
            major: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Require separate capture and verifier-only dispatches
        env:
          PRIOR_RUN: ${{ inputs.readback_run }}
        run: test -z "$PRIOR_RUN"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Build explicitly labelled Go construction controls
        run: |
          mkdir -p artifacts/hfs-empty artifacts/hfs-go
          go build -o artifacts/apfs ./cmd/apfs
          for filesystem in hfsplus hfsx; do
            for capacity in 10936320 16777216; do
              artifacts/apfs pack --filesystem "$filesystem" --capacity "$capacity" --format UDRO --file-compression none --volume-name Growth --time 2025-06-07T08:09:10Z artifacts/hfs-empty "artifacts/hfs-go/$filesystem-$capacity.dmg"
            done
          done
      - name: Capture freshly Apple-formatted controls, exact disks and native outcomes
        run: python3 acceptance/native/hfs_header_growth.py --expected-major "${{ matrix.major }}" --go-images artifacts/hfs-go --output artifacts/hfs-header-growth/macos-${{ matrix.major }}
      - name: Explain the retained native outcomes
        env:
          HFS_MAJOR: ${{ matrix.major }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(Path('artifacts/hfs-header-growth', 'macos-' + os.environ['HFS_MAJOR'], 'manifest.json').read_text())
          failed = sum(c['after']['checker']['status'] != 0 for c in evidence['cases'])
          omitted = sum(not p['allWritesSurvived'] for p in evidence['sectorProbes'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Retained HFS growth and storage evidence\n\n'
                        f"{len(evidence['cases'])} matched Apple/Go filesystem controls completed actual catalog growth and native remount readback. "
                        f'{failed} shadow controls retain explicit failed native checker verdicts.\n\n'
                        f"{len(evidence['sectorProbes'])} unmounted native sector probes retain complete images and actual shadow files; "
                        f'{omitted} record replay omission. These diagnostic failures qualify the evidence, not the mutation route. '
                        'Published HFS image qualification separately requires native success on exact raw copies.\n')
          PY
      - name: Retain complete and interrupted captures for analysis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hfs-header-growth-${{ matrix.major }}
          path: |
            artifacts/hfs-header-growth/
            artifacts/hfs-go/
          if-no-files-found: error
