name: Offline image editing compatibility

on:
  workflow_call:
    inputs:
      readback_run:
        description: Completed run whose captures and portable output jobs must have passed
        type: string
        default: ''
      readback_family:
        description: Existing archived verifier scope; empty verifies every capability
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  families:
    name: Complete ${{ matrix.family }} capture, portable replay and Apple verification
    strategy:
      fail-fast: false
      matrix:
        family: ${{ inputs.readback_run != '' && inputs.readback_family != '' && fromJSON(format('["{0}"]', inputs.readback_family)) || fromJSON('["apfs", "hfs", "hfs-fragmented", "permissions", "statistics", "copy-permissions", "statistics-transitions"]') }}
    uses: ./.github/workflows/offline-family.yml
    with:
      family: ${{ matrix.family }}
      readback_run: ${{ inputs.readback_run }}
      readback_family: ${{ inputs.readback_family }}

  qualified:
    name: Require offline image capture, portable editing and Apple readback
    needs: families
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every complete capability chain
        env:
          FAMILIES: ${{ needs.families.result }}
        run: test "$FAMILIES" = success
