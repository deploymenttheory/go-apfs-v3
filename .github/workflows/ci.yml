name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  portable:
    name: Portable tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Test libraries, readers, workspaces and future acceptance families
        # Full-disk writers have separate required retained-corpus jobs below.
        run: go test -v -parallel 2 -timeout 5m ./... -skip '^TestNative(APFSImage((Directory|Metadata|Link)?Editing(Continuation)?|Copy)|HFS(Journaled)?Image((Catalog|Metadata|Link)?Editing(Continuation)?|Copy)|HFSJournalRecovery|APFSCheckpointRecovery|ImageCopyContinuation|ImageBuilding|ContainerBuilding|ImageRepacking|Phase5(APFS|HFS(Fragmented)?))$'
      - run: go vet ./...

  phase5_retained:
    name: Retained offline editing (${{ matrix.family }}, macOS ${{ matrix.source }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        source: [15, 26, 27]
        family: [APFS geometry and volumes, HFS first attributes, HFS metadata overflow, HFS+ node-map boundary, HFSX node-map boundary]
        include:
          - {family: APFS geometry and volumes, tests: '^TestNativePhase5APFS$'}
          - {family: HFS first attributes, tests: '^TestNativePhase5HFS$/macos-SOURCE/(hfsplus|hfsx)(-journaled)?-first-attribute$'}
          - {family: HFS metadata overflow, tests: '^TestNativePhase5HFSFragmented$'}
          - {family: HFS+ node-map boundary, tests: '^TestNativePhase5HFS$/macos-SOURCE/hfsplus-catalog-map-growth$'}
          - {family: HFSX node-map boundary, tests: '^TestNativePhase5HFS$/macos-SOURCE/hfsx-catalog-map-growth$'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare source immutability, geometry, identities, links, forks and metadata
        shell: bash
        env:
          APFS_REQUIRED_NATIVE_MAJORS: ${{ matrix.source }}
          SELECTED_TESTS: ${{ matrix.tests }}
          SOURCE_MAJOR: ${{ matrix.source }}
        run: |
          test_pattern="${SELECTED_TESTS//SOURCE/$SOURCE_MAJOR}"
          if [[ "$test_pattern" == '^TestNativePhase5APFS$' || "$test_pattern" == '^TestNativePhase5HFSFragmented$' ]]; then
            test_pattern="$test_pattern/macos-$SOURCE_MAJOR/"
          fi
          go test -v -count=1 -timeout 12m ./acceptance -run "$test_pattern"

  portable_acceptance:
    name: Retained acceptance (${{ matrix.family }}, ${{ matrix.source == 'all' && 'all sources' || format('macOS {0} sources', matrix.source) }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        family: [image construction, image repacking, existing HFS edits, existing APFS edits, HFS journal recovery, APFS checkpoint recovery]
        source: [all, 15, 26, 27]
        exclude:
          - {family: image construction, source: 15}
          - {family: image construction, source: 26}
          - {family: image construction, source: 27}
          - {family: image repacking, source: 15}
          - {family: image repacking, source: 26}
          - {family: image repacking, source: 27}
          - {family: HFS journal recovery, source: 15}
          - {family: HFS journal recovery, source: 26}
          - {family: HFS journal recovery, source: 27}
          - {family: APFS checkpoint recovery, source: all}
          - {family: existing HFS edits, source: all}
          - {family: existing APFS edits, source: all}
        include:
          - family: image construction
            tests: '^TestNative(ImageBuilding|ContainerBuilding)$'
          - family: image repacking
            tests: '^TestNativeImageRepacking$'
          - family: HFS journal recovery
            tests: '^TestNativeHFSJournalRecovery$'
          - family: APFS checkpoint recovery
            tests: '^TestNativeAPFSCheckpointRecovery$'
          - family: existing APFS edits
            tests: '^TestNativeAPFSImage(Directory|Metadata|Link)?Editing(Continuation)?$'
          - family: existing HFS edits
            tests: '^TestNativeHFS(Journaled)?Image(Catalog|Metadata|Link)?Editing(Continuation)?$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare the complete family with retained Apple observations
        if: matrix.family != 'existing APFS edits' && matrix.family != 'existing HFS edits' && matrix.family != 'APFS checkpoint recovery'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '${{ matrix.tests }}'
      - name: Compare APFS checkpoint recovery with this retained native source version
        if: matrix.family == 'APFS checkpoint recovery'
        run: go test -v -count=1 -timeout 5m ./acceptance -run '^TestNativeAPFSCheckpointRecovery$/macos-${{ matrix.source }}(/|$)'
      # Source-version jobs keep the growing edit suites within the same bounded
      # deadlines on every host. All three versions remain required by quality.
      - name: Compare APFS file edits with retained Apple observations
        if: matrix.family == 'existing APFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '^TestNativeAPFSImageEditing(Continuation)?$/macos-${{ matrix.source }}(/|$)'
      - name: Compare APFS directory edits with retained Apple observations
        if: matrix.family == 'existing APFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '^TestNativeAPFSImageDirectoryEditing(Continuation)?$/macos-${{ matrix.source }}(/|$)'
      - name: Compare APFS metadata with retained Apple observations
        if: matrix.family == 'existing APFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '^TestNativeAPFSImageMetadataEditing$/macos-${{ matrix.source }}(/|$)'
      - name: Compare APFS link lifetimes with retained Apple observations
        if: matrix.family == 'existing APFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '^TestNativeAPFSImageLinkEditing$/macos-${{ matrix.source }}(/|$)'
      - name: Compare APFS preserved copying with retained Apple observations
        if: matrix.family == 'existing APFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '^TestNativeAPFSImageCopy$/macos-${{ matrix.source }}(/|$)'
      - name: Compare HFS files and catalogs with retained Apple observations
        if: matrix.family == 'existing HFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '^TestNativeHFS(Journaled)?Image(Catalog)?Editing(Continuation)?$/macos-${{ matrix.source }}(/|$)'
      - name: Compare HFS metadata with retained Apple observations
        if: matrix.family == 'existing HFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '^TestNativeHFS(Journaled)?ImageMetadataEditing$/macos-${{ matrix.source }}(/|$)'
      - name: Compare HFS link lifetimes with retained Apple observations
        if: matrix.family == 'existing HFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '^TestNativeHFS(Journaled)?ImageLinkEditing$/macos-${{ matrix.source }}(/|$)'
      - name: Compare HFS preserved copying with retained Apple observations
        if: matrix.family == 'existing HFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '^TestNativeHFS(Journaled)?ImageCopy$/macos-${{ matrix.source }}(/|$)'

  build:
    name: Cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  race_library:
    name: Library race checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Race-check every package outside the separately scheduled acceptance suite
        shell: bash
        run: |
          go list ./... > "$RUNNER_TEMP/race-packages.txt"
          mapfile -t packages < "$RUNNER_TEMP/race-packages.txt"
          library_packages=()
          for package in "${packages[@]}"; do
            if [[ "$package" != github.com/deploymenttheory/go-apfs-v3/acceptance ]]; then
              library_packages+=("$package")
            fi
          done
          test "${#library_packages[@]}" -gt 0
          go test -race -p 1 -timeout 5m "${library_packages[@]}"

  race_acceptance:
    name: Acceptance race checks (${{ matrix.family }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default group includes future acceptance tests automatically.
          # Fresh HFS edits have their own required, source-version race jobs.
          - family: readers and workspaces
            tests: '.'
            skip: '^TestNative(APFSImage((Directory|Metadata|Link)?Editing(Continuation)?|Copy)|HFS(Journaled)?Image((Catalog|Metadata|Link)?Editing(Continuation)?|Copy)|HFSJournalRecovery|APFSCheckpointRecovery|ImageCopyContinuation|ImageBuilding|ContainerBuilding|ImageRepacking|Phase5(APFS|HFS(Fragmented)?))$'
          - family: image construction
            tests: '^TestNative(ImageBuilding|ContainerBuilding)$'
            skip: '^$'
          - family: HFS journal recovery
            tests: '^TestNativeHFSJournalRecovery$'
            skip: '^$'
          - family: APFS checkpoint recovery, macOS 15 sources
            tests: '^TestNativeAPFSCheckpointRecovery$/macos-15/(apfs(-case-sensitive)?-(data|bad-object)|apfs-wrapped|interrupted-Go-commits)(/|$)'
            skip: '^$'
            timeout: '7m'
          - family: APFS checkpoint recovery, macOS 26 sources
            tests: '^TestNativeAPFSCheckpointRecovery$/macos-26/(apfs(-case-sensitive)?-(data|bad-object)|apfs-wrapped|interrupted-Go-commits)(/|$)'
            skip: '^$'
            timeout: '7m'
          - family: APFS checkpoint recovery, macOS 27 sources
            tests: '^TestNativeAPFSCheckpointRecovery$/macos-27/(apfs(-case-sensitive)?-(data|bad-object)|apfs-wrapped|interrupted-Go-commits)(/|$)'
            skip: '^$'
            timeout: '7m'
          - family: image repacking
            tests: '^TestNativeImageRepacking$'
            skip: '^$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare the complete family with retained native observations under race instrumentation
        run: go test -race -v -count=1 -parallel 2 -timeout '${{ matrix.timeout || '5m' }}' ./acceptance -run '${{ matrix.tests }}' -skip '${{ matrix.skip }}'

  quality:
    needs: [portable, portable_acceptance, phase5_retained, race_library, race_acceptance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l block filesystem diskimage apfs hfsplus inspect internal cmd acceptance workspace appledouble session pack imageedit)"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14.0
      - name: Check native verifier logic without running native tools
        run: python3 -m unittest discover -s acceptance/native -p 'test_*.py' -v
      - name: Require every portable and race group
        if: always()
        run: test "$PORTABLE" = success && test "$RETAINED_ACCEPTANCE" = success && test "$PHASE5_RETAINED" = success && test "$LIBRARY_RACES" = success && test "$ACCEPTANCE_RACES" = success
        env:
          PORTABLE: ${{ needs.portable.result }}
          RETAINED_ACCEPTANCE: ${{ needs.portable_acceptance.result }}
          PHASE5_RETAINED: ${{ needs.phase5_retained.result }}
          LIBRARY_RACES: ${{ needs.race_library.result }}
          ACCEPTANCE_RACES: ${{ needs.race_acceptance.result }}
