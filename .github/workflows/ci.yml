name: Native artifact storage diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    name: Storage primitives on macOS ${{ matrix.major }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 26, runner: macos-26}
          - {major: 27, runner: xcode-27}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Measure ordinary file storage without native disk operations
        run: |
          python3 --version
          /usr/bin/tar --version
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE" /private/tmp
          python3 .github/scripts/storage-probe.py
