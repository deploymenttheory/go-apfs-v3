name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  APFS_FIXTURE_CACHE: ${{ github.workspace }}/.fixtures

# Three tiers. checks and unit gate the source. portable reads every Apple
# fixture from macOS 26 and 27 with the product on Linux, Windows and
# macOS and produces images from them; portable-slow replays the
# minutes-long catalog growth stages beside it. native runs on each macOS
# version from the start, reading the other producer's fixtures while
# the portable jobs run, then judges, with Apple tools, the images every host derived from
# that version's fixtures (container checks for sector-preserving repacks;
# check, mount, readback and a representative native continuation for
# images Go wrote) and reads the other producer's fixtures for
# cross-version parity. The fixture corpus is pinned by
# acceptance/fixtures.lock.json and cached by its digest.

jobs:
  checks:
    name: Source checks and cross-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14.0
          args: ./... ./.github/scripts/platform-contracts ./.github/scripts/output-storage
      - run: go vet ./... ./.github/scripts/platform-contracts ./.github/scripts/output-storage
      - name: Test platform contract evidence validation
        run: go test -count=1 -timeout 2m ./.github/scripts/platform-contracts
      - name: Vet and build the darwin-only capture tool and native verifier
        run: |
          GOOS=darwin GOARCH=arm64 go vet -tags fixture ./acceptance/... ./cmd/apfs-fixture
          GOOS=darwin GOARCH=arm64 go vet -tags native ./acceptance/native
          GOOS=darwin GOARCH=arm64 go build -tags fixture -o /dev/null ./cmd/apfs-fixture
      - name: Build every supported operating system and architecture
        shell: bash
        run: |
          for target_os in linux darwin windows; do
            for target_arch in amd64 arm64; do
              GOOS="$target_os" GOARCH="$target_arch" go build ./...
            done
          done

  unit:
    name: Unit tests with the race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Race-check every package outside the acceptance tiers
        shell: bash
        run: |
          mapfile -t packages < <(go list ./... | grep -v /acceptance)
          go test -race -count=1 -timeout 10m "${packages[@]}"

  portable:
    name: Portable conformance (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    # Keep the replay at 25m; allow setup and compressed artifact transport
    # outside that test budget so native consumers receive compact images.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: linux, runner: ubuntu-24.04}
          - {host: windows, runner: windows-2025}
          - {host: darwin, runner: macos-26}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify portable platform contracts
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/platform-contracts"
          mkdir -p "$evidence"
          acceptance_package="$(go list ./acceptance)"
          all_packages="$(go list ./acceptance/...)"
          helper_packages=()
          while IFS= read -r package; do
            if [[ "$package" != "$acceptance_package" ]]; then
              helper_packages+=("$package")
            fi
          done <<< "$all_packages"
          test_status=0
          go test -json -count=1 -timeout 25m "${helper_packages[@]}" > "$evidence/helpers.jsonl" 2> "$evidence/helpers.stderr" || test_status=$?
          cat "$evidence/helpers.jsonl" "$evidence/helpers.stderr"
          go run ./.github/scripts/platform-contracts -events "$evidence/helpers.jsonl" -test-exit "$test_status" -receipt "$evidence/helpers-receipt.json"
      - name: Retain portable platform contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: platform-contracts-portable-${{ matrix.host }}
          path: ${{ runner.temp }}/platform-contracts/
          if-no-files-found: error
      - name: Restore the pinned fixture corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.fixtures
          key: fixtures-${{ hashFiles('acceptance/fixtures.lock.json') }}
      - name: Read every fixture and produce images from them
        shell: bash
        env:
          APFS_OUTPUT_DIR: ${{ runner.temp }}/outputs
        run: |
          acceptance_package="$(go list ./acceptance)"
          go test -count=1 -timeout 25m "$acceptance_package"
      # One artifact for each of the two producers: macOS N verifies only
      # the outputs derived from macOS N's fixtures. Every artifact carries
      # the whole manifest so cross-host pairing sees every name.
      - name: Upload the images derived from macOS 26 fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: outputs-${{ matrix.host }}-macos-26
          path: |
            ${{ runner.temp }}/outputs/outputs.json
            ${{ runner.temp }}/outputs/macos-26.*
          if-no-files-found: error
      - name: Upload the images derived from macOS 27 fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: outputs-${{ matrix.host }}-macos-27
          path: |
            ${{ runner.temp }}/outputs/outputs.json
            ${{ runner.temp }}/outputs/macos-27.*
          if-no-files-found: error

  portable-slow:
    name: Slow portable conformance (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: linux, runner: ubuntu-24.04}
          - {host: windows, runner: windows-2025}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify portable platform contracts
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/platform-contracts"
          mkdir -p "$evidence"
          acceptance_package="$(go list ./acceptance)"
          all_packages="$(go list ./acceptance/...)"
          helper_packages=()
          while IFS= read -r package; do
            if [[ "$package" != "$acceptance_package" ]]; then
              helper_packages+=("$package")
            fi
          done <<< "$all_packages"
          test_status=0
          go test -json -count=1 -timeout 25m "${helper_packages[@]}" > "$evidence/helpers.jsonl" 2> "$evidence/helpers.stderr" || test_status=$?
          cat "$evidence/helpers.jsonl" "$evidence/helpers.stderr"
          go run ./.github/scripts/platform-contracts -events "$evidence/helpers.jsonl" -test-exit "$test_status" -receipt "$evidence/helpers-receipt.json"
      - name: Retain portable platform contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: platform-contracts-catalog-growth-${{ matrix.host }}
          path: ${{ runner.temp }}/platform-contracts/
          if-no-files-found: error
      - name: Restore the pinned fixture corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.fixtures
          key: fixtures-${{ hashFiles('acceptance/fixtures.lock.json') }}
      - name: Replay the catalog growth stages with the image editor
        shell: bash
        env:
          APFS_OUTPUT_DIR: ${{ runner.temp }}/slow-outputs
        run: go test -count=1 -timeout 55m -tags slow -run 'TestGoEditsReproduceAppleStageStates/.*/hfs-catalog-map-growth' ./acceptance
      - name: Upload this host's images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slow-outputs-${{ matrix.host }}
          path: ${{ runner.temp }}/slow-outputs/
          if-no-files-found: error

  native:
    name: Apple verification on macOS ${{ matrix.major }}
    # Cross-version fixture parity needs only the corpus, so native jobs
    # start alongside source and portable checks. The required gate still
    # waits for every check; independent work need not wait for cross-builds.
    # Verify the slow bucket before collecting the main outputs: its artifacts
    # arrive while the main producers are still working, filling that wait.
    permissions:
      contents: read
      actions: read # follow this run's artifacts and jobs
    runs-on: ${{ matrix.runner }}
    # Leave capacity for Darwin producers when CI runs overlap. Each kernel
    # has one existing-image consumer; encrypted construction starts its
    # independent required consumers only after portable producers finish.
    concurrency:
      group: native-filesystem-verification-${{ matrix.major }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 26, runner: macos-26, scope: filesystem-images}
          - {major: 27, runner: xcode-27, scope: filesystem-images}
    env:
      APFS_EXPECT_MAJOR: ${{ matrix.major }}
    steps: &native-image-verification
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify sparse artifact extraction
        run: python3 -m unittest discover -s .github/scripts -p 'test_download_sparse_artifact.py' -v
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify portable platform contracts
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/native-work/kernel-image-ownership-contract/gate-events"
          mkdir -p "$evidence"
          acceptance_package="$(go list ./acceptance)"
          all_packages="$(go list ./acceptance/...)"
          helper_packages=()
          while IFS= read -r package; do
            if [[ "$package" != "$acceptance_package" ]]; then
              helper_packages+=("$package")
            fi
          done <<< "$all_packages"
          test_status=0
          go test -json -count=1 -timeout 25m "${helper_packages[@]}" > "$evidence/helpers.jsonl" 2> "$evidence/helpers.stderr" || test_status=$?
          cat "$evidence/helpers.jsonl" "$evidence/helpers.stderr"
          go run ./.github/scripts/platform-contracts -events "$evidence/helpers.jsonl" -test-exit "$test_status" -receipt "$evidence/helpers-receipt.json"
      - name: Verify native image ownership paths
        id: native_ownership
        shell: bash
        env:
          APFS_NATIVE_WORK: ${{ runner.temp }}/native-work
        run: |
          evidence="$APFS_NATIVE_WORK/kernel-image-ownership-contract/gate-events"
          test_status=0
          go test -json -count=1 -v -timeout 5m -tags native ./acceptance/fixture -run '^TestKernelOwnershipMatchesNativeImagePaths$' > "$evidence/native.jsonl" 2> "$evidence/native.stderr" || test_status=$?
          cat "$evidence/native.jsonl" "$evidence/native.stderr"
          go run ./.github/scripts/platform-contracts -events "$evidence/native.jsonl" -test-exit "$test_status" -receipt "$evidence/native-receipt.json" -native-evidence "$APFS_NATIVE_WORK/kernel-image-ownership-contract" -major "$APFS_EXPECT_MAJOR"
      - name: Retain native image ownership evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-image-ownership-macos-${{ matrix.major }}${{ matrix.scope == 'volume-encryption' && '-volume-encryption' || '' }}
          path: ${{ runner.temp }}/native-work/kernel-image-ownership-contract/
          if-no-files-found: error
      - name: Restore the pinned fixture corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.fixtures
          key: fixtures-${{ hashFiles('acceptance/fixtures.lock.json') }}
      - name: Build the product binary the continuation edits with
        run: go build -o "$RUNNER_TEMP/apfs" ./cmd/apfs
      - name: Read the other versions' fixtures with this kernel
        if: matrix.scope != 'volume-encryption'
        env:
          APFS_NATIVE_GROUPS: fixtures
          APFS_HOST_OUTPUTS: ${{ runner.temp }}/host-outputs
          APFS_PRODUCT_CLI: ${{ runner.temp }}/apfs
          APFS_NATIVE_WORK: ${{ runner.temp }}/native-work
        run: go test -count=1 -v -parallel 5 -timeout 30m -tags native ./acceptance/native
      - name: Wait for the slow bucket's images
        if: matrix.scope != 'volume-encryption'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-artifacts.sh "Slow portable conformance" slow-outputs-linux slow-outputs-windows
      - name: Download the slow bucket's images
        if: matrix.scope != 'volume-encryption'
        uses: actions/download-artifact@v7
        with:
          pattern: slow-outputs-*
          path: ${{ runner.temp }}/host-outputs
      - name: Verify the slow bucket's images with Apple tools
        if: matrix.scope != 'volume-encryption'
        env:
          APFS_NATIVE_GROUPS: slow
          APFS_HOST_OUTPUTS: ${{ runner.temp }}/host-outputs
          APFS_PRODUCT_CLI: ${{ runner.temp }}/apfs
          APFS_NATIVE_WORK: ${{ runner.temp }}/native-work
        run: go test -count=1 -v -parallel 5 -timeout 20m -tags native ./acceptance/native
      - name: Wait for every host's images
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-artifacts.sh "Portable conformance" outputs-linux-macos-${{ matrix.major }} outputs-windows-macos-${{ matrix.major }} outputs-darwin-macos-${{ matrix.major }}
      # Stream at most two sparse host sets concurrently, verify every original
      # image, then share identical bytes before downloading the third set.
      - name: Download and verify linux and windows images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download_host() {
            local host=$1
            python3 .github/scripts/download-sparse-artifact.py "outputs-$host-macos-$APFS_EXPECT_MAJOR" "$RUNNER_TEMP/host-outputs/outputs-$host-macos-$APFS_EXPECT_MAJOR" &&
              go run ./.github/scripts/output-storage -root "$RUNNER_TEMP/host-outputs" -producer "$APFS_EXPECT_MAJOR" -hosts "$host"
          }
          download_host linux &
          linux_pid=$!
          download_host windows &
          windows_pid=$!
          status=0
          wait "$linux_pid" || status=1
          wait "$windows_pid" || status=1
          exit "$status"
      - name: Verify and share identical linux and windows image storage
        run: go run ./.github/scripts/output-storage -root "$RUNNER_TEMP/host-outputs" -producer "$APFS_EXPECT_MAJOR" -hosts linux,windows
      - name: Download darwin images derived from this version's fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/download-sparse-artifact.py "outputs-darwin-macos-$APFS_EXPECT_MAJOR" "$RUNNER_TEMP/host-outputs/outputs-darwin-macos-$APFS_EXPECT_MAJOR"
      - name: Verify and share identical darwin image storage
        run: go run ./.github/scripts/output-storage -root "$RUNNER_TEMP/host-outputs" -producer "$APFS_EXPECT_MAJOR" -hosts linux,windows,darwin
      - name: Verify every host's images with Apple tools
        env:
          APFS_NATIVE_GROUPS: ${{ matrix.scope == 'volume-encryption' && 'volume-encryption' || 'main' }}
          APFS_HOST_OUTPUTS: ${{ runner.temp }}/host-outputs
          APFS_PRODUCT_CLI: ${{ runner.temp }}/apfs
          APFS_NATIVE_WORK: ${{ runner.temp }}/native-work
        # Start long measured lineages first to reduce the serial tail.
        # Parallelism applies to independent filesystem lineages. Outputs
        # sharing a container or volume UUID remain serial within a lineage.
        run: go test -count=1 -v -parallel 5 -timeout 70m -tags native ./acceptance/native
      - name: Upload diagnostics
        if: failure() || matrix.major == 26 || matrix.major == 27
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-diagnostics-macos-${{ matrix.major }}${{ matrix.scope == 'volume-encryption' && '-volume-encryption' || '' }}
          # Existing-image jobs retain bounded matched pairs; volume
          # encryption retains its complete native observations.
          # Failed jobs keep their complete existing diagnostics directory.
          path: ${{ job.status == 'failure' && format('{0}/native-work/', runner.temp) || matrix.scope == 'volume-encryption' && format('{0}/native-work/observe/', runner.temp) || format('{0}/native-work/fork-mapping-pair/', runner.temp) }}
          if-no-files-found: error

  native-volume-encryption:
    name: Apple volume encryption on macOS ${{ matrix.major }}
    # Allocate a VM only when the immutable host outputs are ready.
    needs: [portable]
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: native-volume-encryption-${{ matrix.major }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 26, runner: macos-26, scope: volume-encryption}
          - {major: 27, runner: xcode-27, scope: volume-encryption}
    env:
      APFS_EXPECT_MAJOR: ${{ matrix.major }}
    steps: *native-image-verification

  gate:
    name: Required checks
    needs: [checks, unit, portable, portable-slow, native, native-volume-encryption]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          PORTABLE: ${{ needs.portable.result }}
          SLOW: ${{ needs.portable-slow.result }}
          NATIVE: ${{ needs.native.result }}
          VOLUME_ENCRYPTION: ${{ needs.native-volume-encryption.result }}
        run: test "$CHECKS" = success && test "$UNIT" = success && test "$PORTABLE" = success && test "$SLOW" = success && test "$NATIVE" = success && test "$VOLUME_ENCRYPTION" = success
