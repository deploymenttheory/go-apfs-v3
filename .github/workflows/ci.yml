name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  portable:
    name: Portable tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Test libraries, readers, workspaces and future acceptance families
        # Full-disk writers have separate required retained-corpus jobs below.
        run: go test -v -parallel 2 -timeout 5m ./... -skip '^TestNative(APFSImage(Directory)?Editing(Continuation)?|HFS(Journaled)?Image(Catalog)?Editing(Continuation)?|ImageBuilding|ContainerBuilding|ImageRepacking)$'
      - run: go vet ./...

  portable_acceptance:
    name: Retained acceptance (${{ matrix.family }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        family: [image construction, image repacking, existing HFS edits, existing APFS edits]
        include:
          - family: image construction
            tests: '^TestNative(ImageBuilding|ContainerBuilding)$'
          - family: image repacking
            tests: '^TestNativeImageRepacking$'
          - family: existing APFS edits
            tests: '^TestNativeAPFSImage(Directory)?Editing(Continuation)?$'
          - family: existing HFS edits
            tests: '^TestNativeHFS(Journaled)?Image(Catalog)?Editing(Continuation)?$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare the complete family with retained Apple observations
        if: matrix.family != 'existing APFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '${{ matrix.tests }}'
      # Both APFS groups replay all three source versions. Separate invocations
      # keep a bounded deadline per group on Windows without adding more jobs.
      - name: Compare APFS file edits with retained Apple observations
        if: matrix.family == 'existing APFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '^TestNativeAPFSImageEditing(Continuation)?$'
      - name: Compare APFS directory edits with retained Apple observations
        if: matrix.family == 'existing APFS edits'
        run: go test -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '^TestNativeAPFSImageDirectoryEditing(Continuation)?$'

  build:
    name: Cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  race_library:
    name: Library race checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Race-check every package outside the separately scheduled acceptance suite
        shell: bash
        run: |
          go list ./... > "$RUNNER_TEMP/race-packages.txt"
          mapfile -t packages < "$RUNNER_TEMP/race-packages.txt"
          library_packages=()
          for package in "${packages[@]}"; do
            if [[ "$package" != github.com/deploymenttheory/go-apfs-v3/acceptance ]]; then
              library_packages+=("$package")
            fi
          done
          test "${#library_packages[@]}" -gt 0
          go test -race -p 1 -timeout 5m "${library_packages[@]}"

  race_acceptance:
    name: Acceptance race checks (${{ matrix.family }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default group includes future acceptance tests automatically.
          # Fresh HFS edits have their own required, source-version race jobs.
          - family: readers and workspaces
            tests: '.'
            skip: '^TestNative(APFSImage(Directory)?Editing(Continuation)?|HFS(Journaled)?Image(Catalog)?Editing(Continuation)?|ImageBuilding|ContainerBuilding|ImageRepacking)$'
          - family: image construction
            tests: '^TestNative(ImageBuilding|ContainerBuilding)$'
            skip: '^$'
          - family: image repacking
            tests: '^TestNativeImageRepacking$'
            skip: '^$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare the complete family with retained native observations under race instrumentation
        run: go test -race -v -count=1 -parallel 2 -timeout 5m ./acceptance -run '${{ matrix.tests }}' -skip '${{ matrix.skip }}'

  quality:
    needs: [portable, portable_acceptance, race_library, race_acceptance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l block filesystem diskimage apfs hfsplus inspect internal cmd acceptance workspace appledouble session pack imageedit)"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14.0
      - name: Check native verifier logic without running native tools
        run: python3 -m unittest discover -s acceptance/native -p 'test_*.py' -v
      - name: Require every portable and race group
        if: always()
        run: test "$PORTABLE" = success && test "$RETAINED_ACCEPTANCE" = success && test "$LIBRARY_RACES" = success && test "$ACCEPTANCE_RACES" = success
        env:
          PORTABLE: ${{ needs.portable.result }}
          RETAINED_ACCEPTANCE: ${{ needs.portable_acceptance.result }}
          LIBRARY_RACES: ${{ needs.race_library.result }}
          ACCEPTANCE_RACES: ${{ needs.race_acceptance.result }}
