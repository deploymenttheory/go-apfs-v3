# Transient diagnostic branch only: never merge this workflow into a PR or main.
# This run reuses complete producer inventories and checks only the existing
# container subtests. It is not full CI or performance qualification.
name: Container continuation diagnostic
run-name: Container continuation diagnostic on ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: container-continuation-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  APFS_FIXTURE_CACHE: ${{ github.workspace }}/.fixtures

jobs:
  native:
    name: Container continuation diagnostic on macOS ${{ matrix.major }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 15, runner: macos-15}
          - {major: 26, runner: macos-26}
          - {major: 27, runner: xcode-27}
    env:
      APFS_EXPECT_MAJOR: ${{ matrix.major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore the pinned fixture corpus
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ github.workspace }}/.fixtures
          key: fixtures-${{ hashFiles('acceptance/fixtures.lock.json') }}
      - name: Build the product binary the continuation edits with
        run: go build -o "$RUNNER_TEMP/apfs" ./cmd/apfs
      # The successful portable producers in this full run used f3ef6de and
      # the unchanged pinned corpus. Download every file in all three host
      # artifacts, including each full outputs.json; the parent test still
      # runs LoadOutputs, Pair and every required-output completeness guard.
      - name: Download every host's complete producer inventory
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 39724863344
          pattern: outputs-*-macos-${{ matrix.major }}
          path: ${{ runner.temp }}/host-outputs
          merge-multiple: false
      - name: Diagnose every existing constructed-container verdict
        env:
          APFS_NATIVE_GROUPS: main
          APFS_HOST_OUTPUTS: ${{ runner.temp }}/host-outputs
          APFS_PRODUCT_CLI: ${{ runner.temp }}/apfs
          APFS_NATIVE_WORK: ${{ runner.temp }}/native-work
        run: go test -count=1 -v -parallel 4 -timeout 40m -tags native -run '^TestOutputsWithAppleTools$/^outputs$/^containers$' ./acceptance/native
      - name: Upload diagnostic state
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-continuation-diagnostics-macos-${{ matrix.major }}
          path: ${{ runner.temp }}/native-work/
          if-no-files-found: ignore
