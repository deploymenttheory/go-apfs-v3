name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

# The acceptance tiers (portable conformance on Linux/Windows/macOS and native
# verification on macOS 15/26/27) are being rebuilt under
# https://github.com/deploymenttheory/go-apfs-v3/issues/98. Until #106 lands,
# this workflow gates source checks, cross-builds and race-instrumented unit tests.

jobs:
  checks:
    name: Source checks and cross-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14.0
      - run: go vet ./...
      - name: Vet and build the darwin-only fixture capture tool
        run: |
          GOOS=darwin GOARCH=arm64 go vet -tags fixture ./acceptance/... ./cmd/apfs-fixture
          GOOS=darwin GOARCH=arm64 go build -tags fixture -o /dev/null ./cmd/apfs-fixture
      - name: Build every supported operating system and architecture
        shell: bash
        run: |
          for target_os in linux darwin windows; do
            for target_arch in amd64 arm64; do
              GOOS="$target_os" GOARCH="$target_arch" go build ./...
            done
          done

  unit:
    name: Unit tests with the race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Race-check every package outside the acceptance tiers
        shell: bash
        run: |
          mapfile -t packages < <(go list ./... | grep -v /acceptance)
          go test -race -count=1 -timeout 10m "${packages[@]}"

  gate:
    name: Required checks
    needs: [checks, unit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
        run: test "$CHECKS" = success && test "$UNIT" = success
