name: Diagnose APFS crypto context
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: APFS crypto context on macOS ${{ matrix.major }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 26, runner: macos-26, artifact: 12715689811, digest: d243640c78a563b0e116e7948904d2b4d3d7cde08c09cceec5685b6b02124cd8}
          - {major: 27, runner: xcode-27, artifact: 12716359217, digest: bd4e8d48a256c430b217f40d31bfc28dbda33f35ab9dc68f3d0573173fe5cd38}
    env:
      GOTOOLCHAIN: local
      APFS_EXPECT_MAJOR: ${{ matrix.major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Set private probe paths
        run: |
          echo "APFS_NATIVE_WORK=$RUNNER_TEMP/crypto-context-evidence" >> "$GITHUB_ENV"
          echo "APFS_CRYPTO_CONTEXT_IMAGE=$RUNNER_TEMP/original-capture.dmg" >> "$GITHUB_ENV"
      - name: Read original failed Apple input by verified digest
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_DIGEST: ${{ matrix.digest }}
        run: |
          gh api repos/deploymenttheory/go-apfs-v3/actions/artifacts/${{ matrix.artifact }}/zip > "$RUNNER_TEMP/original.zip"
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, zipfile
          archive=pathlib.Path(os.environ["RUNNER_TEMP"])/"original.zip"
          digest=hashlib.file_digest(archive.open("rb"),"sha256").hexdigest()
          assert digest==os.environ["ARCHIVE_DIGEST"], digest
          member="encrypted-snapshot-history/apfs.retained.dmg"
          with zipfile.ZipFile(archive) as z:
              data=z.read(member)
          pathlib.Path(os.environ["APFS_CRYPTO_CONTEXT_IMAGE"]).write_bytes(data)
          root=pathlib.Path(os.environ["APFS_NATIVE_WORK"])
          root.mkdir()
          (root/"input.json").write_text(json.dumps({"run":40461628393,"artifact":${{ matrix.artifact }},"archiveSHA256":digest,"member":member,"imageSHA256":hashlib.sha256(data).hexdigest()},indent=2))
          PYTHON
      - name: Compare native crypto-context lifetimes
        run: go test -count=1 -timeout 8m -tags native ./acceptance/fixture -run '^TestAPFSCryptoContextAcrossObservationUnmount$' -v
      - name: Retain original probe source and command evidence
        if: always()
        run: |
          mkdir -p "$APFS_NATIVE_WORK"
          cp acceptance/fixture/apfs_crypto_context_native_test.go "$APFS_NATIVE_WORK/collector.go"
          cp .github/workflows/fixtures.yml "$APFS_NATIVE_WORK/workflow.yml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: apfs-crypto-context-macos-${{ matrix.major }}
          path: ${{ runner.temp }}/crypto-context-evidence/
          if-no-files-found: error
