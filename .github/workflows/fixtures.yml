name: Check encrypted APFS construction
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  APFS_FIXTURE_CACHE: ${{ github.workspace }}/.fixtures
jobs:
  check:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 26, runner: macos-26}
          - {major: 27, runner: xcode-27}
    env:
      APFS_EXPECT_MAJOR: ${{ matrix.major }}
      APFS_NATIVE_GROUPS: fixtures
      APFS_NATIVE_WORK: ${{ github.workspace }}/artifacts/encrypted-construction
      APFS_PRODUCT_CLI: ${{ github.workspace }}/artifacts/apfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.fixtures
          key: fixtures-${{ hashFiles('acceptance/fixtures.lock.json') }}
      - run: go build -o "$APFS_PRODUCT_CLI" ./cmd/apfs
      - run: go test -count=1 -v -timeout 20m -tags native ./acceptance/native -run '^TestEncryptedConstructionWithApple$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: encrypted-construction-${{ matrix.major }}
          path: |
            ${{ github.workspace }}/artifacts/encrypted-construction/result.json
            ${{ github.workspace }}/artifacts/encrypted-construction/**/*commands.json
          if-no-files-found: error
