name: Diagnose portable image artifact transfer
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    name: Compare macOS image artifact compression
    runs-on: macos-26
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Retrieve the exact completed Windows output artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 40551820534
          name: outputs-windows-macos-26
          path: ${{ runner.temp }}/host-outputs/outputs-windows-macos-26
      - name: Verify every original output digest
        run: go run ./.github/scripts/output-storage -root "$RUNNER_TEMP/host-outputs" -producer 26 -hosts windows
      - name: Upload unchanged images with default compression
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-macos-output-transfer-deflated
          path: ${{ runner.temp }}/host-outputs/outputs-windows-macos-26/
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
      - name: Upload unchanged images without repeated compression
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-macos-output-transfer-stored
          path: ${{ runner.temp }}/host-outputs/outputs-windows-macos-26/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
