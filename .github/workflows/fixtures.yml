name: Check encrypted APFS storage
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  APFS_FIXTURE_CACHE: ${{ github.workspace }}/.fixtures
jobs:
  check:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 26, runner: macos-26}
          - {major: 27, runner: xcode-27}
    env:
      APFS_EXPECT_MAJOR: ${{ matrix.major }}
      APFS_NATIVE_WORK: ${{ github.workspace }}/artifacts/encrypted-storage-check
      APFS_PRODUCT_CLI: ${{ github.workspace }}/artifacts/apfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o "$APFS_PRODUCT_CLI" ./cmd/apfs
      - run: go test -count=1 -v -timeout 25m -tags native ./acceptance/native -run '^TestEncryptedAPFSStorageBaseline$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: encrypted-storage-check-${{ matrix.major }}
          path: |
            artifacts/encrypted-storage-check/result.json
            artifacts/encrypted-storage-check/commands.json
          if-no-files-found: error
  artifact-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
    steps:
      - name: Inspect one producer artifact without expanding it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/inspect-artifact.py" <<'PY'
          import json, os, struct, sys
          tail=b''
          total=0
          for block in iter(lambda:sys.stdin.buffer.read(1024*1024),b''):
              total+=len(block)
              if total>5*1024**3:raise RuntimeError('artifact exceeds 5 GiB network bound')
              tail=(tail+block)[-2*1024*1024:]
          position=tail.rfind(b'PK\x05\x06')
          if position<0:raise RuntimeError('ZIP footer absent')
          footer=struct.unpack_from('<4s4H2LH',tail,position)
          size,offset=footer[5],footer[6]
          if size>len(tail):raise RuntimeError('ZIP directory exceeds 2 MiB metadata bound')
          cursor=offset-(total-len(tail))
          stop=cursor+size
          if cursor<0:raise RuntimeError('ZIP directory outside retained metadata')
          files=[]
          while cursor<stop:
              item=struct.unpack_from('<4s6H3L5H2L',tail,cursor)
              if item[0]!=b'PK\x01\x02':raise RuntimeError('invalid ZIP directory header')
              name=tail[cursor+46:cursor+46+item[10]].decode()
              files.append({'name':name,'bytes':item[9],'compressed':item[8]})
              cursor+=46+item[10]+item[11]+item[12]
          groups={}
          for item in files:
              parts=item['name'].split('.')
              name=parts[1] if len(parts)>2 else 'manifest'
              group=groups.setdefault(name,{'files':0,'bytes':0})
              group['files']+=1
              group['bytes']+=item['bytes']
          result={'artifactId':12644632952,'networkBytes':total,'maximumRetainedMetadataBytes':2*1024*1024,'downloadedImageBytesStored':0,'diskBytesAfterExtraction':sum(item['bytes'] for item in files),'files':len(files),'largest':sorted(files,key=lambda item:item['bytes'],reverse=True)[:15],'byRecipe':groups}
          with open(os.environ['RUNNER_TEMP']+'/artifact-size.json','w') as stream:json.dump(result,stream,indent=2)
          print(json.dumps(result))
          PY
          gh api repos/deploymenttheory/go-apfs-v3/actions/artifacts/12644632952/zip | python3 "$RUNNER_TEMP/inspect-artifact.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encrypted-output-storage-size
          path: ${{ runner.temp }}/artifact-size.json
          if-no-files-found: error
