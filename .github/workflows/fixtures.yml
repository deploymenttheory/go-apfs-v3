name: Diagnose APFS credential lock state
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: APFS credential lock state on macOS ${{ matrix.major }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 26, runner: macos-26}
          - {major: 27, runner: xcode-27}
    env:
      GOTOOLCHAIN: local
      APFS_EXPECT_MAJOR: ${{ matrix.major }}
      APFS_NATIVE_GROUPS: fixtures
      APFS_FIXTURE_CACHE: ${{ github.workspace }}/.fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.fixtures
          key: fixtures-${{ hashFiles('acceptance/fixtures.lock.json') }}
      - name: Build product and set private evidence paths
        run: |
          go build -o "$RUNNER_TEMP/apfs" ./cmd/apfs
          echo "APFS_PRODUCT_CLI=$RUNNER_TEMP/apfs" >> "$GITHUB_ENV"
          echo "APFS_NATIVE_WORK=$RUNNER_TEMP/credential-lock-evidence" >> "$GITHUB_ENV"
      - name: Retrieve exact original failed and successful output bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 acceptance/native/fetch_credential_output.py
          gh api --allow-escape-sequences repos/deploymenttheory/go-apfs-v3/actions/artifacts/12744278413/zip > "$RUNNER_TEMP/successful-control.zip"
          python3 - <<'PYINNER'
          from pathlib import Path
          import os,zipfile,hashlib
          p=Path(os.environ['RUNNER_TEMP'])/'successful-control.zip'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='88373ab351a59629b9692c95c14e9c9f2aefa88745a965d258f98f5d7b6e821e'
          with zipfile.ZipFile(p) as z:
              data=z.read('generated/reencrypted.dmg')
              assert hashlib.sha256(data).hexdigest()=='1ad0a9b0ab1e4f9a263dee960cdca936b83c341680de571496216ee94d8cf11c'
              (Path(os.environ['APFS_NATIVE_WORK'])/'successful-probe-original.dmg').write_bytes(data)
          PYINNER
      - name: Reproduce plaintext continuation and fresh encryption attachment
        run: go test -count=1 -timeout 20m -tags native ./acceptance/native -run '^TestExactCIPayloadCredentialState$' -v
      - name: Retain original diagnostic and observer sources
        if: always()
        run: |
          mkdir -p "$APFS_NATIVE_WORK"
          cp acceptance/native/credential_lock_state_probe_test.go "$APFS_NATIVE_WORK/probe.go"
          cp acceptance/fixture/observe.go "$APFS_NATIVE_WORK/observer.go"
          cp .github/workflows/fixtures.yml "$APFS_NATIVE_WORK/workflow.yml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: apfs-credential-lock-state-macos-${{ matrix.major }}
          path: ${{ runner.temp }}/credential-lock-evidence/
          if-no-files-found: error
