name: Check encrypted APFS storage
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  APFS_FIXTURE_CACHE: ${{ github.workspace }}/.fixtures
jobs:
  check:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 26, runner: macos-26}
          - {major: 27, runner: xcode-27}
    env:
      APFS_EXPECT_MAJOR: ${{ matrix.major }}
      APFS_NATIVE_WORK: ${{ github.workspace }}/artifacts/encrypted-storage-check
      APFS_PRODUCT_CLI: ${{ github.workspace }}/artifacts/apfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o "$APFS_PRODUCT_CLI" ./cmd/apfs
      - run: go test -count=1 -v -timeout 25m -tags native ./acceptance/native -run '^TestEncryptedAPFSStorageBaseline$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: encrypted-storage-check-${{ matrix.major }}
          path: |
            artifacts/encrypted-storage-check/result.json
            artifacts/encrypted-storage-check/commands.json
          if-no-files-found: error
  artifact-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
    steps:
      - name: Inspect one producer artifact without expanding it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/deploymenttheory/go-apfs-v3/actions/artifacts/12644632952/zip > "$RUNNER_TEMP/output.zip"
          python3 - <<'PY'
          import json, os, zipfile
          from collections import defaultdict
          root=os.environ['RUNNER_TEMP']
          with zipfile.ZipFile(root+'/output.zip') as archive:
              files=archive.infolist()
              manifest=json.loads(archive.read('outputs.json'))
              by_recipe=defaultdict(lambda: {'files':0,'bytes':0})
              for output in manifest['outputs']:
                  if output['source']['producer']!=26:continue
                  group=by_recipe[output['source']['recipe']]
                  group['files']+=1
                  group['bytes']+=output['bytes']
              result={'artifactId':12644632952,'compressedBytes':os.stat(root+'/output.zip').st_size,'diskBytesAfterExtraction':sum(item.file_size for item in files),'files':len(files),'largest':sorted([{'name':item.filename,'bytes':item.file_size} for item in files],key=lambda item:item['bytes'],reverse=True)[:15],'byRecipe':dict(by_recipe)}
          with open(root+'/artifact-size.json','w') as stream:json.dump(result,stream,indent=2)
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encrypted-output-storage-size
          path: ${{ runner.temp }}/artifact-size.json
          if-no-files-found: error
