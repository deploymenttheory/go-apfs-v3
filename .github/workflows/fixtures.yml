name: Diagnose APFS observation key ownership
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: APFS observation key ownership on macOS ${{ matrix.major }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 26, runner: macos-26}
          - {major: 27, runner: xcode-27}
    env:
      GOTOOLCHAIN: local
      APFS_EXPECT_MAJOR: ${{ matrix.major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Set private evidence path
        run: echo "APFS_NATIVE_WORK=$RUNNER_TEMP/crypto-context-evidence" >> "$GITHUB_ENV"
      - name: Run the original observation and next writable stage
        run: go test -count=1 -timeout 10m -tags native ./acceptance/fixture -run '^TestAPFSObservationReleasesKeysForNextStage$' -v
      - name: Retain original probe and checker sources
        if: always()
        run: |
          mkdir -p "$APFS_NATIVE_WORK"
          cp acceptance/fixture/apfs_crypto_context_native_test.go "$APFS_NATIVE_WORK/collector.go"
          cp acceptance/fixture/apfs_verification.go "$APFS_NATIVE_WORK/apfs-verification.go"
          cp .github/workflows/fixtures.yml "$APFS_NATIVE_WORK/workflow.yml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: apfs-observation-key-ownership-macos-${{ matrix.major }}
          path: ${{ runner.temp }}/crypto-context-evidence/
          if-no-files-found: error
