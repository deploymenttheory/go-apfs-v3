name: APFS checkpoint recovery

on:
  workflow_call:
    inputs:
      reuse_references:
        description: Use independently qualified inputs only after the caller admits the reviewed pin
        type: boolean
        default: false
      capture_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      capture_only:
        description: 'Record interrupted Apple checkpoints and native selection only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apfs-recovery-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    name: ${{ inputs.reuse_references && 'Restore reviewed Apple interrupted' || 'Capture interrupted Apple' }} checkpoints and selected filesystem state (macOS ${{ inputs.reuse_references && '15, 26 and 27' || matrix.major }})
    runs-on: ${{ matrix.major == 'all' && 'ubuntu-24.04' || matrix.major == 15 && 'macos-15' || matrix.major == 26 && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        major: ${{ inputs.reuse_references && fromJSON('["all"]') || fromJSON('[15,26,27]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: ${{ inputs.reuse_references }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore verified original Apple reference inputs
        if: ${{ inputs.reuse_references }}
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for source_major in 15 26 27; do
            python3 acceptance/qualification/reference_reuse.py materialize \
              --assets "$RUNNER_TEMP/native-reference-assets" \
              --artifact "apfs-recovery-reference-$source_major" \
              --major "$source_major" \
              --destination "artifacts/reviewed-inputs-$source_major" \
              --scratch "$RUNNER_TEMP" \
              --proof "artifacts/qualification/capture-approved-$source_major/admission.json"
          done
      - name: Require a disposable GitHub-hosted VM
        if: ${{ !(inputs.reuse_references) }}
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Retain real incomplete and complete checkpoints and Apple's independent verdict
        if: ${{ !(inputs.reuse_references) }}
        run: python3 acceptance/native/apfs_checkpoint_recovery.py --expected-major "${{ matrix.major }}" --output artifacts/apfs-recovery/macos-${{ matrix.major }}
      - name: Record required native capture observations
        if: ${{ !(inputs.reuse_references) }}
        run: >-
          python3 acceptance/native/qualification_capture.py
          --expected-major "${{ matrix.major }}"
          --input "apfs-recovery=artifacts/apfs-recovery"
          --output "artifacts/qualification/capture-apfs-recovery"
      - name: Retain interrupted disks, selected state and diagnostics
        if: ${{ always() && !(inputs.reuse_references) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-recovery-reference-${{ matrix.major }}
          path: artifacts/apfs-recovery/macos-${{ matrix.major }}
          compression-level: 0
          if-no-files-found: error
      - name: Retain reviewed original input bytes (macOS 15)
        if: ${{ inputs.reuse_references }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-recovery-reference-15
          path: artifacts/reviewed-inputs-15
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Retain reviewed original input bytes (macOS 26)
        if: ${{ inputs.reuse_references }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-recovery-reference-26
          path: artifacts/reviewed-inputs-26
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Retain reviewed original input bytes (macOS 27)
        if: ${{ inputs.reuse_references }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-recovery-reference-27
          path: artifacts/reviewed-inputs-27
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Retain required capture execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-apfs-recovery-${{ github.job }}-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            artifacts/qualification/capture-*/
            artifacts/qualification/replay-*/plan.json
            artifacts/qualification/replay-*/receipt.json
            artifacts/qualification/replay-*/events.jsonl
            artifacts/qualification/replay-*/inputs.json
            artifacts/qualification/replay-*/source-inputs.json
            artifacts/**/.qualification/*/*.json
            artifacts/**/.qualification/*/*.jsonl
            artifacts/**/*.plan.json
            artifacts/**/*.receipt.json
            artifacts/**/*.events.jsonl
          if-no-files-found: error

  replay:
    if: ${{ !inputs.capture_only }}
    name: Compare checkpoint recovery and interrupted commits with Apple (${{ matrix.platform }}, ${{ matrix.scope }})
    needs: capture
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: Linux, scope: macOS 15, source: 15, race: '', artifact: Linux-15}
          - {runner: ubuntu-24.04, platform: Linux, scope: macOS 26, source: 26, race: '', artifact: Linux-26}
          - {runner: ubuntu-24.04, platform: Linux, scope: macOS 27, source: 27, race: '', artifact: Linux-27}
          - {runner: windows-2025, platform: Windows, scope: all sources, source: '', race: '', artifact: Windows}
          - {runner: macos-26, platform: macOS, scope: all sources, source: '', race: '', artifact: macOS}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v7
        with:
          pattern: apfs-recovery-reference-*
          path: artifacts/apfs-recovery
      - name: Arrange independently recorded source versions
        shell: bash
        run: |
          for major in 15 26 27; do
            mv "artifacts/apfs-recovery/apfs-recovery-reference-$major" "artifacts/apfs-recovery/macos-$major"
          done
      - name: Compare selected state, disk bytes, metadata and actual torn commit boundaries
        shell: bash
        run: |
          sources=(15 26 27)
          if [[ -n "$RECOVERY_SOURCE" ]]; then sources=("$RECOVERY_SOURCE"); fi
          for major in "${sources[@]}"; do
            go run ./acceptance/qualification -replay -- -v -count=1 -timeout 5m ./acceptance -run "^TestNativeAPFSCheckpointRecovery$/macos-$major(/|$)"
          done
        env:
          CGO_ENABLED: '0'
          RECOVERY_SOURCE: "${{ matrix.source }}"
          APFS_NATIVE_CHECKPOINT_RECOVERY: ../artifacts/apfs-recovery
          APFS_CHECKPOINT_RECOVERY_OUTPUT: ../artifacts/recovered-${{ matrix.platform }}
      - name: Archive actual portable outputs and Go interruption evidence
        shell: bash
        run: |
          options=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            options=(--no-mac-metadata --no-xattrs --no-acls)
          fi
          tar -czf "artifacts/recovered-${{ matrix.artifact }}.tgz" "${options[@]}" -C artifacts "recovered-${{ matrix.platform }}"
      - name: Interrupt an actual partial CLI scratch copy
        shell: bash
        run: |
          go build -o "artifacts/apfs${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/apfs
          python3 acceptance/native/recovery_interruption.py --filesystem apfs --apfs "artifacts/apfs${{ runner.os == 'Windows' && '.exe' || '' }}" --references artifacts/apfs-recovery/macos-15 --diagnostics artifacts/interruption
      - name: Retain process interruption diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-recovery-interruption-${{ matrix.artifact }}
          path: artifacts/interruption
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-recovered-${{ matrix.artifact }}
          path: artifacts/recovered-*.tgz
          compression-level: 0
          if-no-files-found: error

  readback:
    if: ${{ !inputs.capture_only }}
    name: Verify all portable checkpoint recovery, torn commits and native writes (macOS ${{ matrix.major }})
    needs: [capture, replay]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26, xcode-27]
        include:
          - {runner: macos-15, major: 15}
          - {runner: macos-26, major: 26}
          - {runner: xcode-27, major: 27}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require a disposable GitHub-hosted VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/download-artifact@v7
        with:
          name: apfs-recovery-reference-${{ matrix.major }}
          path: artifacts/references
      - uses: actions/download-artifact@v7
        with:
          name: apfs-recovered-Linux-${{ matrix.major }}
          path: artifacts/archives
      - uses: actions/download-artifact@v7
        with:
          name: apfs-recovered-Windows
          path: artifacts/archives
      - uses: actions/download-artifact@v7
        with:
          name: apfs-recovered-macOS
          path: artifacts/archives
      - name: Unpack all completed host outputs
        run: |
          for archive_file in artifacts/archives/recovered-*.tgz; do
            tar -xzf "$archive_file" -C artifacts
          done
      - name: Apple checker, complete metadata/fork readback, signatures and native continued allocation
        run: |
          for portable_host in Linux Windows macOS; do
            python3 acceptance/native/verify_apfs_checkpoint_recovery.py --expected-major "${{ matrix.major }}" --references artifacts/references --outputs "artifacts/recovered-$portable_host/macos-${{ matrix.major }}" --diagnostics "artifacts/verification/$portable_host"
            python3 acceptance/native/qualification_complete.py --plan "artifacts/verification/$portable_host/apfs-recovery-macos-${{ matrix.major }}.plan.json"
          done
      - name: Retain independent Apple verdicts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apfs-recovery-verification-${{ matrix.major }}
          path: artifacts/verification
          if-no-files-found: warn
      - name: Retain required case execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-apfs-recovery-${{ github.job }}-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            artifacts/qualification/capture-*/
            artifacts/qualification/replay-*/plan.json
            artifacts/qualification/replay-*/receipt.json
            artifacts/qualification/replay-*/events.jsonl
            artifacts/qualification/replay-*/inputs.json
            artifacts/qualification/replay-*/source-inputs.json
            artifacts/**/.qualification/*/*.json
            artifacts/**/.qualification/*/*.jsonl
            artifacts/**/*.plan.json
            artifacts/**/*.receipt.json
            artifacts/**/*.events.jsonl
          if-no-files-found: error

  complete:
    name: Require APFS checkpoint recovery qualification
    if: ${{ always() && !inputs.capture_only }}
    needs: [capture, replay, readback]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Apple control, portable recovery and native continuation
        env:
          CAPTURE: ${{ needs.capture.result }}
          REPLAY: ${{ needs.replay.result }}
          READBACK: ${{ needs.readback.result }}
        run: test "$CAPTURE" = success && test "$REPLAY" = success && test "$READBACK" = success
